<!DOCTYPE html>
<html>
<head>
    <title>ES6修复测试</title>
</head>
<body>
    <h1>ES6修复测试页面</h1>
    <div id="test-results"></div>
    
    <!-- 加载修复后的文件 -->
    <script src="src/core/storage/AutogenUnifiedStorage.js"></script>
    <script src="src/core/messaging/AutogenEventBus.js"></script>
    <script src="src/migration/StorageMigrationTool.js"></script>
    <script src="src/storage/UnifiedStorageManager.js"></script>
    <script src="src/core/EventBus.js"></script>
    <script src="scripts/system_health_check.js"></script>
    
    <script>
        // 测试脚本
        function runTests() {
            const results = [];
            
            // 测试1: 检查全局变量是否正确定义
            results.push({
                test: 'AutogenUnifiedStorage全局变量',
                result: typeof window.AutogenUnifiedStorage !== 'undefined' ? '✅ 通过' : '❌ 失败'
            });
            
            results.push({
                test: 'AutogenEventBus全局变量',
                result: typeof window.AutogenEventBus !== 'undefined' ? '✅ 通过' : '❌ 失败'
            });
            
            results.push({
                test: 'StorageMigrationTool全局变量',
                result: typeof window.StorageMigrationTool !== 'undefined' ? '✅ 通过' : '❌ 失败'
            });
            
            results.push({
                test: 'UnifiedStorageManager类',
                result: typeof window.UnifiedStorageManager !== 'undefined' ? '✅ 通过' : '❌ 失败'
            });
            
            results.push({
                test: 'SimpleEventBus全局变量',
                result: typeof window.SimpleEventBus !== 'undefined' ? '✅ 通过' : '❌ 失败'
            });
            
            results.push({
                test: 'SystemHealthChecker全局变量',
                result: typeof window.SystemHealthChecker !== 'undefined' ? '✅ 通过' : '❌ 失败'
            });
            
            // 测试2: 尝试创建实例
            try {
                const unifiedStorage = new window.UnifiedStorageManager();
                results.push({
                    test: 'UnifiedStorageManager实例创建',
                    result: '✅ 通过'
                });
            } catch (error) {
                results.push({
                    test: 'UnifiedStorageManager实例创建',
                    result: `❌ 失败: ${error.message}`
                });
            }
            
            try {
                const eventBus = new window.SimpleEventBus();
                results.push({
                    test: 'SimpleEventBus实例创建',
                    result: '✅ 通过'
                });
            } catch (error) {
                results.push({
                    test: 'SimpleEventBus实例创建',
                    result: `❌ 失败: ${error.message}`
                });
            }
            
            // 显示结果
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '<h2>测试结果:</h2>' + 
                results.map(r => `<p><strong>${r.test}:</strong> ${r.result}</p>`).join('');
            
            console.log('ES6修复测试完成:', results);
        }
        
        // 页面加载完成后运行测试
        window.addEventListener('load', runTests);
        
        // 监听错误
        window.addEventListener('error', function(e) {
            console.error('页面错误:', e.message, e.filename, e.lineno);
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML += `<p style="color: red;"><strong>错误:</strong> ${e.message}</p>`;
        });
    </script>
</body>
</html>
