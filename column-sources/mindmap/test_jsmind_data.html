<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试jsMind data序列化</title>
    <link rel="stylesheet" href="../../vendor/jsmind/style/jsmind.css">
    <script src="../../vendor/jsmind/js/jsmind.js"></script>
</head>
<body>
    <div id="jsmind_container" style="width:100%;height:400px;"></div>
    <button onclick="testData()">测试数据</button>
    <pre id="output"></pre>

    <script>
        // 初始化jsMind
        const mind = {
            meta: { name: "测试", author: "test", version: "1.0" },
            format: "node_tree",
            data: {
                id: "root",
                topic: "根节点",
                children: [
                    { id: "node1", topic: "子节点1" }
                ]
            }
        };

        const options = {
            container: 'jsmind_container',
            editable: false,
            theme: 'primary'
        };

        const jm = new jsMind(options);
        jm.show(mind);

        function testData() {
            const output = document.getElementById('output');
            let result = '';

            // 1. 获取节点并添加data
            const node1 = jm.get_node('node1');
            result += '=== 步骤1：获取节点 ===\n';
            result += `node1: ${JSON.stringify(node1, null, 2)}\n\n`;

            // 2. 添加data.content
            if (!node1.data) node1.data = {};
            node1.data.content = "测试内容ABC123";
            result += '=== 步骤2：添加data.content ===\n';
            result += `node1.data: ${JSON.stringify(node1.data, null, 2)}\n\n`;

            // 3. 再次获取节点验证
            const node1Again = jm.get_node('node1');
            result += '=== 步骤3：再次获取节点 ===\n';
            result += `node1Again.data: ${JSON.stringify(node1Again.data, null, 2)}\n\n`;

            // 4. 调用get_data()
            const exportData = jm.get_data();
            result += '=== 步骤4：get_data()返回 ===\n';
            result += `exportData: ${JSON.stringify(exportData, null, 2)}\n\n`;

            // 5. 在exportData中查找node1
            const findNode = (node, id) => {
                if (node.id === id) return node;
                if (node.children) {
                    for (let child of node.children) {
                        const found = findNode(child, id);
                        if (found) return found;
                    }
                }
                return null;
            };
            const exportNode1 = findNode(exportData.data, 'node1');
            result += '=== 步骤5：在exportData中查找node1 ===\n';
            result += `exportNode1: ${JSON.stringify(exportNode1, null, 2)}\n\n`;

            output.textContent = result;
        }
    </script>
</body>
</html>
