    <script>
        // 脑图工作栏核心逻辑
        class MindmapColumn {
            constructor() {
                this.jm = null;
                this.currentNodeId = null;
                this.mindmapId = 'mindmap_column_standalone';
                this.isFullscreen = false;
                
                // 🆕 Phase 2: 存储协调器（替代直接使用mindmapStorage）
                this.storageCoordinator = null;
                
                // 🆕 日志辅助方法（使用UnifiedLogger）
                this._log = {
                    info: (msg, data) => {
                        if (data !== undefined) {
                            window.UnifiedLogger?.info('MINDMAP', msg, data) || console.log(`[脑图工作栏] ${msg}`, data);
                        } else {
                            window.UnifiedLogger?.info('MINDMAP', msg) || console.log(`[脑图工作栏] ${msg}`);
                        }
                    },
                    warn: (msg, data) => {
                        if (data !== undefined) {
                            window.UnifiedLogger?.warn('MINDMAP', msg, data) || console.warn(`[脑图工作栏] ${msg}`, data);
                        } else {
                            window.UnifiedLogger?.warn('MINDMAP', msg) || console.warn(`[脑图工作栏] ${msg}`);
                        }
                    },
                    error: (msg, data) => {
                        if (data !== undefined) {
                            window.UnifiedLogger?.error('MINDMAP', msg, data) || console.error(`[脑图工作栏] ${msg}`, data);
                        } else {
                            window.UnifiedLogger?.error('MINDMAP', msg) || console.error(`[脑图工作栏] ${msg}`);
                        }
                    },
                    debug: (msg, data) => {
                        if (data !== undefined) {
                            window.UnifiedLogger?.debug('MINDMAP', msg, data);
                        } else {
                            window.UnifiedLogger?.debug('MINDMAP', msg);
                        }
                    }
                };
                
                this.init();
            }

            async init() {
                // 🔧 架构整改P1：初始化StorageAdapter
                this.storageAdapter = null;
                if (typeof window.StorageAdapter !== 'undefined') {
                    try {
                        this.storageAdapter = new window.StorageAdapter();
                        await this.storageAdapter.initialize();
                        // 初始化日志已合并
                    } catch (err) {
                        this._log.error('❌ StorageAdapter初始化失败', err);
                        this._log.warn('将使用降级模式');
                        // 降级：不使用StorageAdapter，直接使用AutogenUnifiedStorage
                        this.storageAdapter = null;
                    }
                } else {
                    this._log.warn('StorageAdapter未加载，使用降级模式');
                }
                
                // 🆕 Phase 2: 初始化存储协调器
                if (typeof window.MindmapStorageCoordinator !== 'undefined' && this.storageAdapter) {
                    this.storageCoordinator = new window.MindmapStorageCoordinator(
                        this.storageAdapter,
                        window.AutogenEventBus,
                        console
                    );
                    // 初始化日志已合并
                } else {
                    this._log.warn('存储协调器初始化失败，将使用传统模式');
                }
                
                // 🆕 Phase 2: 初始化事件协调器（需要在jsMind创建后再初始化）
                this.eventCoordinator = null;
                
                // 🆕 Phase 2: 初始化错误处理器
                if (typeof window.MindmapErrorHandler !== 'undefined') {
                    this.errorHandler = new window.MindmapErrorHandler(
                        window.ErrorHandler,
                        console
                    );
                    // 初始化日志已合并
                } else {
                    this.errorHandler = null;
                }

                // 使用DependencyManager确保架构组件加载
                if (typeof window.DependencyManager !== 'undefined') {
                    try {
                        await window.DependencyManager.initializeAll();
                        this._log.info('架构组件初始化完成');
                    } catch (err) {
                        this._log.warn('架构组件初始化失败，继续使用基础功能', err);
                    }
                }

                // 使用ModuleActivation激活脑图模块
                if (typeof window.ModuleActivation !== 'undefined') {
                    try {
                        await window.ModuleActivation.activateModule('mindmap');
                        this._log.info(' 脑图模块激活完成');
                    } catch (err) {
                        console.warn('[脑图工作栏] 脑图模块激活失败，继续使用基础功能:', err);
                    }
                }

                // 创建统一操作API实例（暂时没有jm实例）
                this.ops = new MindmapOperations(null);
                
                // 初始化jsMind，禁用默认快捷键
                const options = {
                    container: 'jsmind_container',
                    editable: true,
                    theme: 'primary',
                    mode: 'side',  // ✅ 右侧布局模式（所有节点在右侧）
                    support_html: false,
                    shortcut: {
                        enable: false  // ❌ 禁用jsMind默认快捷键，完全由我们自己处理
                    },
                    view: {
                        hmargin: 100,
                        vmargin: 50,
                        line_width: 2,
                        line_color: '#558'
                    }
                };

                this.jm = new jsMind(options);
                
                // 为操作类设置jsMind实例
                this.ops.jm = this.jm;
                // 初始化日志已合并
                
                // 🆕 Phase 2: 初始化事件协调器（jsMind已创建）
                if (typeof window.MindmapEventCoordinator !== 'undefined') {
                    this.eventCoordinator = new window.MindmapEventCoordinator(
                        this.jm,
                        window.AutogenEventBus,
                        window.MindmapEventManager
                    );
                    this.eventCoordinator.init();
                    // 初始化日志已合并
                }
                
                // 🆕 Phase 2.1: 初始化内容编辑器
                if (typeof window.MindmapContentEditor !== 'undefined') {
                    this.contentEditor = new window.MindmapContentEditor(
                        this.jm,
                        this.storageCoordinator,
                        this.eventCoordinator,
                        this.errorHandler
                    );
                    // 初始化日志已合并
                }
                
                // 🆕 Phase 2.1: 初始化UI管理器
                if (typeof window.MindmapUIManager !== 'undefined') {
                    this.uiManager = new window.MindmapUIManager(
                        this.jm,
                        this.eventCoordinator
                    );

                    // 初始化日志已合并
                }
                                
                // 🆕 Phase 2.1: 初始化数据加载器
                if (typeof window.MindmapDataLoader !== 'undefined') {
                    this.dataLoader = new window.MindmapDataLoader(
                        this.jm,
                        this.storageCoordinator,
                        this.uiManager,
                        this.errorHandler
                    );
                    // 初始化日志已合并
                }
                // 🆕 创建并初始化兼容层
                this.compat = new MindmapCompatLayer({
                    useSourceArchitecture: true,  // 启用 src/ 架构
                    fallbackToStandalone: true,   // 失败时回退
                    debugMode: true               // 调试模式
                });
                
                // 🔧 架构整改P1：注入StorageAdapter到兼容层
                await this.compat.initialize(this.jm, this.ops, {
                    storageAdapter: this.storageAdapter
                });
                
                // 检查架构状态
                const status = this.compat.getArchitectureStatus();
                this._log.debug('架构状态', status);
                
                // 优先从统一存储加载，失败回退到测试数据
                await this.loadInitialData();
                
                // 绑定事件
                this.bindEvents();
                
                // 绑定全局快捷键（Ctrl+C/X/V）
                this.bindGlobalShortcuts();
                
                // 隐藏加载状态
                document.getElementById('loading').style.display = 'none';
                
                // 初始化时自动选择根节点并加载内容
                setTimeout(() => {
                    const rootNode = this.jm.get_node('root');
                    if (rootNode) {
                        this.jm.select_node('root');
                        this.onNodeSelected(rootNode);
                    }
                }, 200);

                // 🔧 架构改进：页面卸载前强制持久化保存
                window.addEventListener('beforeunload', async (e) => {
                    try {
                        this._log.info(' 页面卸载，开始强制保存...');
                        
                        // 1. 保存当前节点内容
                        if (this.contentEditor) {
                            this.contentEditor.autoSaveCurrentContent();
                        }
                        
                        // 2. 获取完整数据
                        const data = this.jm.get_data();
                        
                        // 3. 同步所有节点content（使用统一工具）
                        DataSyncHelper.syncAllNodes(this.jm, data);
                        
                        // 4. 强制同步保存（不使用防抖）
                        await this.saveToUnifiedStorage(data);
                        
                        // 5. 等待持久化完成
                        await new Promise(resolve => setTimeout(resolve, 100));
                        
                        this._log.info(' ✅ 强制保存完成');
                    } catch (error) {
                        console.error('[脑图工作栏] ❌ 强制保存失败:', error);
                        // 保存失败时阻止关闭（可选）
                        // e.preventDefault();
                        // e.returnValue = '数据尚未保存完成，确定要离开吗？';
                        // return e.returnValue;
                    }
                });
                
                // 初始化右键菜单
                this.contextMenu = new ContextMenuManager(this.jm, this);
                // 初始化日志已合并
                
                // 🆕 初始化关系管理器
                await this.initRelationManager();
                
                this._log.info('✅ 脑图初始化完成 (8个组件)');
            }

            // 修复jsMind内部所有节点的数据结构
            _fixJsMindNodeData() {
                if (!this.jm) return;
                
                // 获取所有节点
                const allNodes = this.jm.get_data();
                if (!allNodes || !allNodes.data) return;
                
                let fixedCount = 0;  // 统计修复的节点数
                
                // 递归修复所有节点
                const fixNode = (nodeData) => {
                    if (!nodeData) return;
                    
                    // 获取jsMind内部节点
                    const jmNode = this.jm.get_node(nodeData.id);
                    if (jmNode && jmNode.data && jmNode.data.data) {
                        // 错误结构：node.data = { data: { content: "" }, meta: {...} }
                        const innerData = jmNode.data.data;
                        const meta = jmNode.data.meta;
                        
                        // 🔧 修复：优先从innerData.content获取，如果为空则从原始位置获取
                        const originalContent = jmNode.data.content || '';
                        const nestedContent = innerData.content || '';
                        
                        // 重建正确的data结构
                        jmNode.data = {
                            content: nestedContent || originalContent,  // ✅ 保留原始content
                            meta: meta || {}
                        };
                        
                        fixedCount++;  // 计数，不再每个节点都输出日志
                    }
                    
                    // 递归修复子节点
                    if (nodeData.children && nodeData.children.length > 0) {
                        nodeData.children.forEach(child => fixNode(child));
                    }
                };
                
                fixNode(allNodes.data);
                
                // 只记录一次总结
                if (fixedCount > 0) {
                    console.log(`[脑图工作栏] ✅ 修复了${fixedCount}个节点的数据结构`);
                }
            }

            // 🆕 Phase 0: 确保MindmapStorage实例存在（统一实例管理）
            _ensureMindmapStorage() {
                if (!this.mindmapStorage && this.storageAdapter) {
                    this.mindmapStorage = new window.MindmapStorage({
                        storageAdapter: this.storageAdapter,
                        eventBus: window.AutogenEventBus,
                        logger: console
                    });
                    this._log.info(' ✅ MindmapStorage实例已创建并缓存');
                }
                return this.mindmapStorage;
            }

            async loadInitialData() {
                try {
                    // 🆕 Phase 2: 使用存储协调器加载数据
                    if (this.storageCoordinator) {
                        const stored = await this.storageCoordinator.loadMindmap('current');
                        
                        // 检查是否有实际数据（不是默认的空数据）
                        // 判断标准：有子节点 或 meta中有实际信息
                        const hasRealData = stored && stored.data && (
                            (stored.data.children && stored.data.children.length > 0) ||
                            (stored.meta && stored.meta.name && stored.meta.name !== 'default_mindmap')
                        );
                        
                        if (hasRealData) {
                            this.jm.show(stored);
                            
                            // 🔧 修复jsMind内部节点的数据结构
                            this._fixJsMindNodeData();
                            
                            this.updateNodeCount();
                            this._log.info(' ✅ 已从IndexedDB加载持久化数据 (自动还原)');
                            return;
                        } else {
                            this._log.info(' IndexedDB中只有默认数据，尝试加载初始数据文件');
                        }
                    }
                    
                    // 如果IndexedDB没有数据，尝试加载 mindmap_base.json（初始数据）
                    try {
                        const response = await fetch('mindmap_base.json');
                        if (response.ok) {
                            const data = await response.json();
                            
                            // 🔧 修复：初始化所有节点的data.content字段
                            const initNodeData = (node) => {
                                if (!node.data) node.data = {};
                                if (!node.data.content) node.data.content = '';
                                if (node.children) {
                                    node.children.forEach(child => initNodeData(child));
                                }
                            };
                            if (data.data) {
                                initNodeData(data.data);
                            }
                            
                            this.jm.show(data);
                            this.updateNodeCount();
                            this._log.info(' 📄 已加载初始数据文件 mindmap_base.json（已初始化data.content字段）');
                            // 立即保存到IndexedDB（会自动压缩），下次就能加载
                            await this.saveToUnifiedStorage(this.jm.get_data());
                            return;
                        }
                    } catch (fileErr) {
                        this._log.info(' mindmap_base.json 加载失败:', fileErr.message);
                    }
                    
                    console.warn('[脑图工作栏] 未找到任何数据，加载测试数据');
                } catch (e) {
                    if (window.ErrorHandler && typeof window.ErrorHandler.handle === 'function') {
                        window.ErrorHandler.handle(e, { component: 'MindmapColumn', action: 'loadInitialData' }, { silent: true });
                    }
                    console.error('[脑图工作栏] 加载失败，回退到测试数据:', e);
                }
                this.loadTestData();
            }

                        this.relationManager = new RelationManager(this.jm, {

                        });

            bindGlobalShortcuts() {
                // 绑定全局快捷键
                document.addEventListener('keydown', (e) => {
                    // 检查是否在编辑状态
                    const isEditing = document.activeElement.tagName === 'INPUT' || 
                                     document.activeElement.tagName === 'TEXTAREA' ||
                                     document.activeElement.isContentEditable;
                    
                    // 如果在编辑状态，不拦截快捷键
                    if (isEditing) return;
                    
                    // Tab - 添加子节点
                    if (e.key === 'Tab' && !e.ctrlKey) {
                        e.preventDefault();
                        const node = this.ops.addChild();
                        if (node) {
                            this.updateNodeCount();
                            this.updateLastModified();
                            this.autoSave();
                        }
                        return false;
                    }
                    
                    // Ctrl+Enter - 添加子节点（备用快捷键）
                    if (e.ctrlKey && e.key === 'Enter') {
                        e.preventDefault();
                        const node = this.ops.addChild();
                        if (node) {
                            this.updateNodeCount();
                            this.updateLastModified();
                            this.autoSave();
                        }
                        return false;
                    }
                    
                    // Enter - 添加兄弟节点
                    if (e.key === 'Enter' && !e.ctrlKey) {
                        e.preventDefault();
                        const node = this.ops.addBrother();
                        if (node) {
                            this.updateNodeCount();
                            this.updateLastModified();
                            this.autoSave();
                        }
                        return false;
                    }
                    
                    // Delete - 删除节点
                    if (e.key === 'Delete') {
                        e.preventDefault();
                        const success = this.ops.removeNode();
                        if (success) {
                            this.updateNodeCount();
                            this.updateLastModified();
                            this.autoSave();
                        }
                        return false;
                    }
                    
                    // Ctrl+C - 复制
                    if (e.ctrlKey && e.key === 'c') {
                        e.preventDefault();
                        const success = this.ops.copyNode();
                        if (success) {
                            this.showMessage('节点已复制');
                        }
                        return false;
                    }
                    
                    // Ctrl+X - 剪切
                    if (e.ctrlKey && e.key === 'x') {
                        e.preventDefault();
                        const success = this.ops.cutNode();
                        if (success) {
                            this.showMessage('节点已剪切');
                        } else {
                            this.showMessage('无法剪切根节点', 'error');
                        }
                        return false;
                    }
                    
                    // Ctrl+V - 粘贴为关系节点
                    if (e.ctrlKey && e.key === 'v') {
                        e.preventDefault();
                        
                        // 检查剪贴板是否有数据
                        if (!this.ops.clipboard || !this.ops.clipboard.hasData()) {
                            this.showMessage('剪贴板为空', 'error');
                            return false;
                        }
                        
                        // 获取当前选中的节点作为目标父节点
                        const targetParent = this.jm.get_selected_node();
                        if (!targetParent) {
                            this.showMessage('请先选择目标父节点', 'error');
                            return false;
                        }
                        
                        // 获取剪贴板中的源节点
                        const sourceNode = this.ops.clipboard.clipboardData;
                        
                        // 🆕 使用RelationManager创建关系节点
                        if (this.relationManager) {
                            const newNode = this.relationManager.createRelationNode(
                                sourceNode,
                                targetParent,
                                'RELATED_TO'  // 默认关联关系
                            );
                            
                            if (newNode) {
                                this.showMessage('⬌ 关系节点已创建');
                                this.jm.select_node(newNode.id);
                                this.updateNodeCount();
                                this.updateLastModified();
                                this.autoSave();
                            } else {
                                this.showMessage('关系节点创建失败', 'error');
                            }
                        } else {
                            // 降级：使用原有的粘贴逻辑
                            const newNode = this.ops.pasteNode();
                            if (newNode) {
                                this.showMessage('节点已粘贴');
                                this.updateNodeCount();
                                this.updateLastModified();
                                this.autoSave();
                            }
                        }
                        
                        return false;
                    }
                });
                
                // 快捷键日志已合并到初始化
            }

                const editor = document.getElementById('nodeContentEditor');
                const titleInput = document.getElementById('nodeTitleEditor');
                const btnSave = document.getElementById('contentSaveBtn');
                const btnClear = document.getElementById('contentCancelBtn');
                
                if (btnSave && !btnSave.__bound) {
                    btnSave.__bound = true;
                    btnSave.addEventListener('click', () => { if (this.contentEditor) { this.contentEditor.saveFromSidebar(); } });
                }
                
                if (btnClear && !btnClear.__bound) {
                    btnClear.__bound = true;
                    btnClear.addEventListener('click', () => { if (editor) editor.value = ''; });
                }
                
                if (titleInput && !titleInput.__bound) {
                    titleInput.__bound = true;
                    
                    // 回车直接保存标题
                    titleInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            if (this.contentEditor) { this.contentEditor.saveFromSidebar(); }
                        }
                    });
                    
                    // 标题失去焦点时自动保存
                    titleInput.addEventListener('blur', () => {
                        if (this.contentEditor) { this.contentEditor.autoSaveCurrentContent(); }
                    });
                }
                
                if (editor && !editor.__bound) {
                    editor.__bound = true;
                    
                    // 内容框失去焦点时自动保存
                    editor.addEventListener('blur', () => {
                        if (this.contentEditor) { this.contentEditor.autoSaveCurrentContent(); }
                    });
                    
                    // 内容框输入时延迟自动保存（防止频繁保存）
                    let saveTimeout;
                    editor.addEventListener('input', () => {
                        clearTimeout(saveTimeout);
                        saveTimeout = setTimeout(() => {
                            if (this.contentEditor) { this.contentEditor.autoSaveCurrentContent(); }

            addNode() {
                const selectedNode = this.jm.get_selected_node();
                if (!selectedNode) {
                    alert('请先选择一个节点');
                    return;
                }

                const topic = prompt('输入新节点名称:', '新节点');
                if (topic) {

                    // 统一核心引擎会自动生成时间戳、选择节点、进入编辑模式

                        direction: 'right'
                    });
                    
                    if (node) {
                        this.updateNodeCount();
                        this.updateLastModified();
                        this.autoSave();
                    }

            editNode() {
                const selectedNode = this.jm.get_selected_node();
                if (!selectedNode) {
                    alert('请先选择一个节点');
                    return;
                }

                if (selectedNode.id === 'root') {
                    alert('根节点不可编辑');
                    return;
                }

                const newTopic = prompt('修改节点名称:', selectedNode.topic);
                if (newTopic && newTopic !== selectedNode.topic) {
                    // ✅ 使用统一API：updateNode
                    this.ops.updateNode(selectedNode, newTopic);
                    this.updateLastModified();
                    this.autoSave();
                }
            }

            deleteNode() {
                const selectedNode = this.jm.get_selected_node();
                if (!selectedNode) {
                    alert('请先选择一个节点');
                    return;
                }

                if (selectedNode.id === 'root') {
                    alert('根节点不可删除');
                    return;
                }

                if (confirm(`确定删除节点"${selectedNode.topic}"吗？`)) {
                    // 使用统一API删除节点
                    if (this.ops.removeNode(selectedNode)) {
                        this.updateNodeCount();
                        this.updateLastModified();
                        // 自动保存
                        this.autoSave();
                    }
                }
            }

            // 自动保存方法
            async autoSave() {
                try {
                    const data = this.jm.get_data();
                    
                    // 🔧 手动同步所有节点的data（使用统一工具）
                    DataSyncHelper.syncAllNodes(this.jm, data);
                    
                    await this.saveToUnifiedStorage(data);
                    this._log.debug('自动保存完成');
                } catch (err) {
                    console.error('[脑图工作栏] 自动保存失败:', err);
                }
            }

            async save() {
                const data = this.jm.get_data();
                this._log.info(' 💾 手动保存开始');
                
                try {
                    // 1. 保存JSON格式到IndexedDB（自动保存功能继续使用）
                    await this.saveToUnifiedStorage(data);
                    this._log.info(' ✅ JSON格式已保存到IndexedDB');
                    
                    // 2. 检查浏览器是否支持File System Access API
                    if ('showSaveFilePicker' in window) {
                        await this.saveWithFilePicker(data);
                    } else {
                        // 不支持文件选择器，提示用户
                        alert('❌ 当前浏览器不支持文件选择器功能\n\n建议使用：\n• Chrome 86+\n• Edge 86+\n• Opera 72+\n\n数据已保存到IndexedDB，可以继续使用。');
                        console.warn('[脑图工作栏] 浏览器不支持File System Access API');
                    }
                    
                    // 3. 按照数据底座规范v1.2格式保存到文件（兼容旧功能）
                    await this.saveMindmapToDataBase();
                    
                    // 4. 触发保存事件
                    this.emitEvent('mindmap.data.saved', {
                        mindmapId: this.mindmapId,
                        nodeCount: this.countNodes(data.data),
                        formats: ['json', 'md']
                    });
                } catch (error) {
                    console.error('[脑图工作栏] ❌ 保存失败:', error);
                    alert('❌ 保存失败：' + error.message);
                }
            }
            
            // 使用文件选择器保存（推荐方式）
            async saveWithFilePicker(data) {
                try {
                    const timestamp = Date.now();
                    const baseName = data.meta?.name || '脑图';

            async saveContentFromSidebarSilent() {
                try {
                    const node = this.jm.get_selected_node();
                    if (!node) {
                        console.warn('[脑图工作栏] 静默保存：没有选中的节点');
                        return;
                    }
                    const editor = document.getElementById('nodeContentEditor');
                    const titleInput = document.getElementById('nodeTitleEditor');
                    const text = editor ? editor.value : '';  // 不要trim，保留空行
                    const newTitle = titleInput ? titleInput.value.trim() : '';
                    
                    // 标题变更则更新节点标题
                    if (newTitle && newTitle !== node.topic) {
                        // ✅ 使用统一API：updateNode
                        this.ops.updateNode(node, newTitle);
                        
                        // 更新UI显示
                        document.getElementById('currentNode').textContent = newTitle;
                        
                        this.emitEvent('mindmap.node.title.updated', { nodeId: node.id, title: newTitle });

                    }
                    
                    if (!node.data) node.data = {};
                    // 统一放在 data.content 字段
                    node.data.content = text;
                    this.updateLastModified();
                    this._log.info(' 静默保存节点内容到 node.data.content');
                    
                    // 🔧 关键修复：确保 jsMind 内部节点也更新了 data
                    const jmNode = this.jm.get_node(node.id);
                    if (jmNode) {
                        if (!jmNode.data) jmNode.data = {};

                    }
                    
                    // 触发内容更新事件
                    this.emitEvent('mindmap.node.content.updated', {
                        nodeId: node.id,
                        topic: node.topic,
                        content: text
                    });
                    
                    // 持久化整个脑图数据

                    if (window.ErrorHandler && typeof window.ErrorHandler.handle === 'function') {

                    }
                } catch (err) {

                        window.ErrorHandler.handle(err, { component: 'MindmapColumn', action: 'saveMindmapToDataBase' }, { silent: false });

            // 转换为数据底座规范v1.2格式
            convertToDataBaseFormat(mindmapData) {
                const convertNode = (node, parentId = null) => {
                    // 基础节点结构
                    const baseNode = {
                        id: node.id,
                        topic: node.topic,
                        children: []
                    };

                    // data层：纯业务内容数据
                    baseNode.data = {
                        content: node.data?.content || '',
                        // 保留其他业务数据
                        ...(node.data || {})
                    };

                    // meta层：统一的关系表达（v1.2规范）
                    baseNode.meta = {
                        itemType: node.meta?.itemType || 'task',
                        parentId: parentId,
                        
                        // v1.1兼容字段（保留）
                        relatedIds: node.meta?.relatedIds || [],
                        dependencies: node.meta?.dependencies || [],
                        
                        // v1.2新增：详细关系表达
                        relations: [],
                        
                        // 其他元数据
                        status: node.meta?.status || 'pending',
                        priority: node.meta?.priority || 'medium',
                        assignee: node.meta?.assignee || '',
                        tags: node.meta?.tags || [],
                        
                        // 时间戳
                        createdAt: node.meta?.createdAt || Date.now(),
                        updatedAt: Date.now()
                    };

                    // 处理现有关系数据，转换为v1.2格式
                    if (node.meta?.relatedIds?.length > 0) {
                        node.meta.relatedIds.forEach(targetId => {
                            baseNode.meta.relations.push({
                                id: `rel_${Date.now()}_${targetId}`,
                                type: 'relates_to',
                                targetId: targetId,
                                targetTopic: '', // 需要查找目标节点标题
                                strength: 0.5,
                                confidence: 1.0,
                                source: 'user_defined',
                                bidirectional: true,
                                createdAt: Date.now(),
                                updatedAt: Date.now(),
                                needsConfirmation: false
                            });
                        });
                    }

                    if (node.meta?.dependencies?.length > 0) {
                        node.meta.dependencies.forEach(targetId => {
                            baseNode.meta.relations.push({
                                id: `rel_${Date.now()}_${targetId}`,
                                type: 'depends_on',
                                targetId: targetId,
                                targetTopic: '', // 需要查找目标节点标题
                                strength: 0.9,
                                confidence: 1.0,
                                source: 'user_defined',
                                bidirectional: false,
                                createdAt: Date.now(),
                                updatedAt: Date.now(),
                                needsConfirmation: false,
                                reason: '用户定义的依赖关系'
                            });
                        });
                    }

                    // 处理父子关系
                    if (parentId) {
                        baseNode.meta.relations.push({
                            id: `rel_parent_${Date.now()}`,
                            type: 'parent_child',
                            targetId: parentId,
                            targetTopic: '', // 父节点标题
                            strength: 1.0,
                            confidence: 1.0,
                            source: 'user_created',
                            bidirectional: false,
                            createdAt: Date.now(),
                            updatedAt: Date.now(),
                            needsConfirmation: false
                        });
                    }

                    // 递归处理子节点
                    if (node.children && node.children.length > 0) {
                        baseNode.children = node.children.map(child => 
                            convertNode(child, node.id)
                        );
                    }

                    return baseNode;
                };

                // 转换整个脑图
                const convertedData = {
                    meta: {
                        name: mindmapData.meta?.name || '脑图数据',
                        author: mindmapData.meta?.author || 'user',
                        version: '1.2',
                        format: 'md_database_v1.2',
                        createdAt: Date.now(),
                        updatedAt: Date.now(),
                        description: '按照数据底座规范v1.2格式保存的脑图数据'
                    },
                    format: 'node_tree',
                    data: convertNode(mindmapData.data)
                };
                return convertedData;
            }

            // 使用filepicker保存文件
            async saveWithFilePicker(data) {
                try {
                    // 🆕 智能压缩数据（如果压缩引擎可用）
                    let dataToSave = data;
                    if (typeof window.DataCompressor !== 'undefined') {
                        const compressor = new window.DataCompressor();
                        dataToSave = compressor.compress(data);
                        this._log.info(' 文件保存：数据已压缩');
                    }
                    
                    // 检查浏览器是否支持File System Access API
                    if ('showSaveFilePicker' in window) {
                        // 使用现代File System Access API
                        const fileHandle = await window.showSaveFilePicker({
                            suggestedName: `mindmap_${new Date().toISOString().slice(0, 10)}.json`,
                            types: [{
                                description: '脑图数据文件',
                                accept: {
                                    'application/json': ['.json']
                                }
                            }]
                        });

                        const writable = await fileHandle.createWritable();
                        await writable.write(JSON.stringify(dataToSave, null, 2));
                        await writable.close();

                        this._log.info(' 文件已保存:', fileHandle.name);
                        return true;
                    } else {
                        // 降级到传统下载方式
                        const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { 
                            type: 'application/json' 
                        });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `mindmap_${new Date().toISOString().slice(0, 10)}.json`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);

                        this._log.info(' 文件已下载（降级模式）');
                        return true;
                    }
                } catch (err) {
                    if (err.name === 'AbortError') {
                        this._log.info(' 用户取消保存');
                        return false;
                        }
                    throw err;
                }
            }

            // ========== 新增功能 ==========

            // 搜索节点
            searchNodes(keyword) {
                if (!keyword || keyword.trim() === '') {
                    // 清空高亮
                    this.clearHighlight();
                    return;
                }

                const data = this.jm.get_data();
                const results = this.findNodesByKeyword(data.data, keyword.trim().toLowerCase());
                
                if (results.length > 0) {
                    console.log(`[脑图工作栏] 搜索到 ${results.length} 个节点:`, results.map(n => n.topic));
                    // 选中第一个结果
                    this.jm.select_node(results[0].id);
                } else {
                    this._log.info(' 未找到匹配节点');
                }
            }

            findNodesByKeyword(node, keyword) {
                let results = [];
                
                if (node.topic && node.topic.toLowerCase().includes(keyword)) {
                    results.push(node);
                }
                
                if (node.children) {
                    node.children.forEach(child => {
                        results = results.concat(this.findNodesByKeyword(child, keyword));
                    });
                }
                
                return results;
            }

                    status: document.getElementById('propStatus').value,
                    priority: document.getElementById('propPriority').value,
                    assignee: document.getElementById('propAssignee').value.trim(),

                };

                // 更新节点data
                if (!this.currentEditingNode.data) {
                    this.currentEditingNode.data = {};
                }
                if (!this.currentEditingNode.data.meta) {
                    this.currentEditingNode.data.meta = {};
                }
                
                Object.assign(this.currentEditingNode.data.meta, properties);

                this._log.info(' 属性已保存:', properties);

            // 辅助方法：在数据树中查找节点
            findNodeInData(node, nodeId) {
                if (!node) return null;
                if (node.id === nodeId) return node;
                
                if (node.children) {
                    for (const child of node.children) {
                        const found = this.findNodeInData(child, nodeId);
                        if (found) return found;

                return null;

            // 统一存储保存（使用存储协调器）
            async saveToUnifiedStorage(data) {
                try {
                    // 🚨 关键修复：保存前必须同步所有节点的content（使用统一工具）
                    // 原因：jm.get_data()不会自动导出node.data字段
                    DataSyncHelper.syncAllNodes(this.jm, data);
                    
                    // 🆕 Phase 2: 使用存储协调器保存
                    if (this.storageCoordinator) {
                        const success = await this.storageCoordinator.saveMindmap(data, true);
                        this._log.debug('数据已保存', {id: this.mindmapId, success});
                        return success;
                    }
                    
                    // 降级：使用传统方式
                    if (!this.storageAdapter) {
                        throw new Error('StorageAdapter未初始化，请检查init()方法');
                    }
                    
                    const mindmapStorage = this._ensureMindmapStorage();
                    const success = await mindmapStorage.saveMindmapData(data, true);
                    this._log.info(' ✅ 数据已保存（降级模式）:', this.mindmapId, '结果:', success);
                    return success;
                } catch (err) {
                    if (window.ErrorHandler && typeof window.ErrorHandler.handle === 'function') {
                        window.ErrorHandler.handle(err, { component: 'MindmapColumn', action: 'saveToUnifiedStorage' }, { silent: true });
                    }
                    console.error('[脑图工作栏] 保存失败:', err);
                    throw err;
                }
            }
        }

        // 启动

        // 🔧 架构整改P1：调试工具改用StorageAdapter
        window.debugRecoverCache = async function() {

            const storageAdapter = window.mindmapColumn?.storageAdapter;
            if (!storageAdapter) {

            try {

                if (cached) {

                    // 检查是否有实际数据
                    const hasData = cached.data && (

                        window.mindmapColumn.jm.show(cached);
                        window.mindmapColumn.updateNodeCount();
                        console.log('✅ 恢复完成！');
                        return cached;
                    } else {
                        console.log('⚠️ 缓存只有默认数据，无需恢复');
                        return null;
                    }
                } else {
                    console.log('❌ 未找到缓存数据');
                    return null;
                }
            } catch (error) {
                console.error('❌ 恢复缓存失败:', error);
                return null;
            }
        };
        
        console.log('💡 提示：在控制台执行 debugRecoverCache() 可手动恢复缓存数据');
    </script>
</body>
</html>
