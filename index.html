<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理系统 - 工作栏生态</title>
    
    <!-- 核心样式 -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/column-warehouse.css">
    
    <!-- 必要的库 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- jsMind 库 -->
    <link rel="stylesheet" href="vendor/jsmind/style/jsmind.css">
    <script src="vendor/jsmind/js/jsmind.js"></script>
    <script src="vendor/jsmind/js/jsmind.draggable-node.js"></script>
    
    <!-- Markdown 渲染 -->
    <script src="vendor/marked/marked.min.js"></script>
    <link rel="stylesheet" href="vendor/github-markdown/github-markdown.min.css">
    
    <!-- iconfont 图标库 -->
    <link rel="stylesheet" href="vendor/iconfont/iconfont.css">
</head>
<body>
    <!-- 系统栏 -->
    <div class="system-bar">
        <div class="view-toggles">
            <h1 style="margin:0;font-size:18px;color:#333;">项目管理系统</h1>
        </div>
        <div style="display:flex;align-items:center;gap:12px;margin-left:auto;">
            <button id="open-warehouse-btn" style="padding:8px 16px;background:linear-gradient(135deg,#6366f1 0%,#4f46e5 100%);color:white;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;transition:all 0.2s;" title="打开工作栏仓库">
                🏪 仓库
            </button>
            <div id="storage-health-indicator" class="healthy" title="存储系统正常"></div>
        </div>
    </div>
    
    <!-- 工作栏容器（空容器，由ColumnRegistry动态填充） -->
    <div class="content-container" id="columns-container">
        <!-- 工作栏将由ColumnRegistry动态注入 -->
    </div>
    
    <!-- 全局日志面板 -->
    <div id="global-log-panel-container" style="position:fixed;bottom:20px;right:20px;width:400px;max-height:300px;z-index:9999;background:white;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.1);">
        <div id="list-log-controls" style="display:flex;gap:8px;margin-bottom:4px;justify-content:flex-end;padding:8px;">
            <button id="log-export-file" type="button" style="padding:2px 8px;font-size:11px;background:#8b5cf6;color:white;border:0;border-radius:3px;cursor:pointer;">💾 导出</button>
            <button id="log-show-history" type="button" style="padding:2px 8px;font-size:11px;background:#f59e0b;color:white;border:0;border-radius:3px;cursor:pointer;">📜 历史</button>
            <button id="list-log-clear" type="button" style="padding:2px 8px;font-size:11px;background:#ef4444;color:white;border:0;border-radius:3px;cursor:pointer;">🗑️ 清空</button>
            <button id="list-log-copy" type="button" style="padding:2px 8px;font-size:11px;background:#3b82f6;color:white;border:0;border-radius:3px;cursor:pointer;">📋 复制</button>
        </div>
        <div id="list-log-panel" data-collapsed="false" style="border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;">
            <button id="list-log-header" type="button" style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:#f8fafc;border:0;border-bottom:1px solid #e5e7eb;width:100%;cursor:pointer;">
                <span style="font-size:12px;color:#6b7280;">系统日志</span>
                <span id="list-log-caret" style="font-size:12px;color:#9ca3af;">▾</span>
            </button>
            <pre id="list-log-body" style="display:block;margin:0;padding:6px 8px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;font-size:12px;line-height:1.4;background:#ffffff;"></pre>
        </div>
    </div>

    <!-- 隐藏文件选择框 -->
    <input type="file" id="fileInputMindmap" accept=".json,.mindmap.json" style="display:none" />
    <input type="file" id="fileInputAttachment" multiple style="display:none" />
    <input type="file" id="fileInputAgent" accept=".agt,.team,.json" style="display:none" />
    
    <!-- ========== 核心架构脚本 ========== -->
    
    <!-- 日志面板已改用LogPanel模块，旧的内联代码已删除 -->
    
    <!-- 样心存储和事件系统 -->
    <script src="src/core/storage/AutogenUnifiedStorage.js"></script>
    <script src="src/core/messaging/AutogenEventBus.js"></script>
    <script src="src/core/DependencyManager.js"></script>
    <script src="src/core/SystemInitializationCoordinator.js"></script>
    
    <!-- 统一日志系统（整合版） -->
    <script src="src/core/UnifiedLogger.js"></script>
    <script src="column-sources/mindmap/js/LogPanel.js"></script>
    <script src="src/core/ErrorBacktracer.js"></script>
    
    <!-- AI开发工作流监控系统 -->
    <script src="src/core/ai-workflow/ArchitectureAlignmentChecker.js"></script>
    <script src="src/core/ai-workflow/ModuleComplianceChecker.js"></script>
    <script src="src/core/ai-workflow/AIWorkflowMonitor.js"></script>
    
    <!-- 工作栏生态系统核心 -->
    <script src="js/core/column-registry.js?v=20251001"></script>
    <script src="js/core/column-warehouse.js?v=20251001-fix-final"></script>
    <script src="js/core/column-warehouse-ui.js?v=20251001"></script>
    
    <!-- 主控制器（必需） -->
    <script src="jsmind-controller.js"></script>
    <script src="script.js"></script>
    
    <!-- 初始化脚本 - 使用SystemInitializationCoordinator -->
    <script>
        window.addEventListener('DOMContentLoaded', async function() {
            console.log('[系统] 🚀 使用SystemInitializationCoordinator统一初始化');
            
            // 统一日志系统（整合版）
            if (window.UnifiedLogger) {
                // UnifiedLogger已自动初始化为全局单例
                console.log('[日志] ✅ UnifiedLogger已初始化（整合版）');
                
                // 创建LogPanel实例（统一日志面板）
                if (window.LogPanel) {
                    window.logPanelInstance = new LogPanel('global-log-panel-container', window.UnifiedLogger);
                    // 向后兼容：保持window.LogPanel作为静态接口
                    window.LogPanel = {
                        log: (m) => window.logPanelInstance.log(m),
                        warn: (m) => window.logPanelInstance.warn(m),
                        error: (m) => window.logPanelInstance.error(m),
                        json: (t, o) => window.logPanelInstance.json(t, o)
                    };
                    console.log('[日志] ✅ LogPanel已嵌入（统一模块）');
                }
            }
            
            // 使用现有的SystemInitializationCoordinator
            if (window.SystemInitializationCoordinator) {
                try {
                    const result = await window.SystemInitializationCoordinator.coordinateSystemInitialization();
                    
                    if (result.success) {
                        console.log('[系统] ✅ 系统初始化完成');
                        window.UnifiedLogger?.info('SYSTEM', '系统初始化完成');
                    } else {
                        console.error('[系统] ⚠️ 系统初始化失败，但继续运行');
                        window.UnifiedLogger?.warn('SYSTEM', '系统初始化失败，但继续运行');
                    }
                } catch (error) {
                    console.error('[系统] ❌ SystemInitializationCoordinator执行异常:', error);
                    window.UnifiedLogger?.error('SYSTEM', 'SystemInitializationCoordinator执行异常', error);
                }
            } else {
                console.warn('[系统] ⚠️ SystemInitializationCoordinator未加载，使用简单初始化');
                window.UnifiedLogger?.warn('SYSTEM', 'SystemInitializationCoordinator未加载');
            }
            
            // 绑定仓库按钮
            document.getElementById('open-warehouse-btn')?.addEventListener('click', function() {
                console.log('[仓库] 点击仓库按钮');
                if (window.ColumnWarehouseUI) {
                    console.log('[仓库] 调用 ColumnWarehouseUI.show()');
                    window.ColumnWarehouseUI.show();
                } else {
                    console.error('[仓库] ❌ ColumnWarehouseUI未初始化');
                    alert('仓库UI未初始化，请稍后再试');
                }
            });
            
            // 系统就绪提示
            setTimeout(() => {
                console.log('[系统] ✅ 系统已就绪');
                console.log('[提示] 点击 🏪 仓库按钮管理工作栏');
                
                // 显示已注册的工作栏
                if (window.ColumnRegistry) {
                    const columns = Array.from(window.ColumnRegistry.columns?.keys() || []);
                    console.log('[工作栏] 已注册工作栏:', columns.length, columns);
                }
                
                // 显示仓库中的工作栏
                if (window.ColumnWarehouse) {
                    const warehouseColumns = Array.from(window.ColumnWarehouse.warehouseColumns?.keys() || []);
                    console.log('[仓库] 仓库中的工作栏:', warehouseColumns.length, warehouseColumns);
                }
            }, 1000);
        });
    </script>
</body>
</html>
