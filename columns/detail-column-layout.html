<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点详情工作栏</title>
    
    <!-- Markdown渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link rel="stylesheet" href="detail-column-styles.css">
</head>
<body>
    <div class="detail-column" id="detail-column">
        <div class="column-header">
            <h3>📝 详情</h3>
        </div>
        
        <!-- 选项卡容器 -->
        <div id="detail-tabs" class="tabs">
            <!-- 选项卡导航已移除 -->
            
            <div class="tabs-content" id="detail-tabs-content">
                <!-- 详情面板 -->
                <div class="tab-pane active" data-tab="detail">
                    <!-- 标题栏 -->
                    <div class="detail-item">
                        <h4>标题</h4>
                        <input type="text" id="detail-title-input" placeholder="输入标题" />
                        <div class="node-id" id="detail-node-id">未选择</div>
                    </div>
                    
                    <!-- 标签区域 -->
                    <div class="detail-item">
                        <h4>标签（点击选择，选中的标签会自动添加到内容开头）</h4>
                        <div id="tag-groups-container">
                            <div class="tag-group-row">
                                <span class="tag-group-name">优先级</span>
                                <div class="tag-chip" data-group="优先级" data-tag="重要">重要</div>
                                <div class="tag-chip" data-group="优先级" data-tag="紧急">紧急</div>
                                <div class="tag-chip" data-group="优先级" data-tag="一般">一般</div>
                            </div>
                            <div class="tag-group-row">
                                <span class="tag-group-name">状态</span>
                                <div class="tag-chip" data-group="状态" data-tag="进行中">进行中</div>
                                <div class="tag-chip" data-group="状态" data-tag="已完成">已完成</div>
                                <div class="tag-chip" data-group="状态" data-tag="待处理">待处理</div>
                                <div class="tag-chip" data-group="状态" data-tag="已取消">已取消</div>
                            </div>
                            <div class="tag-group-row">
                                <span class="tag-group-name">类型</span>
                                <div class="tag-chip" data-group="类型" data-tag="项目">项目</div>
                                <div class="tag-chip" data-group="类型" data-tag="任务">任务</div>
                                <div class="tag-chip" data-group="类型" data-tag="目标">目标</div>
                                <div class="tag-chip" data-group="类型" data-tag="想法">想法</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 内容编辑器 -->
                    <div class="detail-item">
                        <h4>内容（Markdown）</h4>
                        <textarea id="detail-content-editor" placeholder="在此编写内容...

# 示例标题
这是一段示例文本。

## 会话1
这里是第一个会话的内容。
支持Markdown格式。

## 会话2
这里是第二个会话的内容。
可以包含代码、列表等。"></textarea>
                        <div style="margin-top:8px;display:flex;gap:8px;">
                            <button class="btn btn-secondary" id="save-content" title="保存内容到本地文件">💾 保存到本地</button>
                            <button class="btn btn-secondary" id="fullscreen-btn" title="全屏编辑模式">🔲 全屏</button>
                            <button class="btn btn-secondary" id="paste-icon-btn" title="粘贴图标">📋 粘贴图标</button>
                        </div>
                    </div>
                    
                    <!-- 附件区域（包含图片和其他文件） -->
                    <div class="detail-item">
                        <h4>附件（图片和文件）</h4>
                        <button class="btn btn-secondary" id="add-attachment">➕ 添加附件</button>
                        <ul class="attachments-list" id="attachments-list" style="margin-top:12px;">
                            <!-- 附件列表将动态生成，包括粘贴的图片 -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 全屏模式覆盖层 -->
    <div class="mm-fs-overlay" id="mm-fs-overlay">
        <!-- 编辑器面板 -->
        <div class="mm-fs-pane" id="mm-fs-pane">
            <div class="mm-toolbar">
                <div class="left">
                    <button class="mm-btn" id="fs-exit">退出全屏</button>
                    <button class="mm-btn" id="fs-save">💾 保存</button>
                </div>
                <div class="right">
                    <button class="mm-btn" id="fs-preview">👁️ 预览</button>
                    <button class="mm-btn" id="fs-zoom-in">A+</button>
                    <button class="mm-btn" id="fs-zoom-out">A-</button>
                    <button class="mm-btn" id="fs-zoom-reset">重置</button>
                </div>
            </div>
            <textarea class="mm-editor" id="mm-fs-editor"></textarea>
            <div class="mm-preview markdown-body" id="mm-fs-preview"></div>
        </div>
        
        <!-- 会话列表面板 -->
        <div class="mm-fs-sessions" id="mm-fs-sessions">
            <div class="mm-session-header">
                <label class="mm-sel-all" title="全选/全不选">
                    <input type="checkbox" class="mm-sel-all-cb" id="mm-sel-all-cb" /> 全选
                </label>
                <div style="flex:1"></div>
                <button type="button" class="mm-btn" id="add-session">➕ 新增</button>
                <button type="button" class="mm-btn" id="copy-selected" title="复制所选会话为Markdown">📋 复制</button>
            </div>
            <div class="mm-session-items" id="mm-session-items">
                <!-- 会话列表将动态生成 -->
            </div>
        </div>
    </div>
    
    <!-- 隐藏文件选择框 -->
    <input type="file" id="file-input-attachment" multiple style="display:none" />
    
    <!-- 加载JS模块 -->
    <script src="detail-column-core.js"></script>
    <script src="detail-column-sessions.js"></script>
    <script src="detail-column-fullscreen.js"></script>
    
    <script>
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            window.detailColumn = new DetailColumnCore();
            console.log('[DetailColumn] 系统初始化完成');
        });
    </script>
</body>
</html>
