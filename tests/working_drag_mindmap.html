<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>完全可工作的拖拽脑图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      overflow: hidden;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 15px 25px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    
    .controls {
      display: flex;
      gap: 12px;
    }
    
    .btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
      font-weight: 500;
    }
    
    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    .container {
      height: calc(100vh - 120px);
      position: relative;
    }
    
    #mindmap {
      width: 100%;
      height: 100%;
    }
    
    /* 节点样式 */
    .node-group {
      cursor: pointer;
    }
    
    .node-rect {
      rx: 8;
      ry: 8;
      stroke-width: 2;
      transition: all 0.2s ease;
    }
    
    .node-rect:hover {
      stroke-width: 3px;
      filter: brightness(1.1);
    }
    
    .node-rect.draggable {
      cursor: grab;
    }
    
    .node-rect.dragging {
      cursor: grabbing;
      stroke: #ff6b6b !important;
      stroke-width: 4px !important;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
    }
    
    .node-rect.drop-target {
      stroke: #00ff88 !important;
      stroke-width: 4px !important;
      filter: drop-shadow(0 0 15px #00ff88);
      animation: dropTargetPulse 1s infinite;
    }
    
    @keyframes dropTargetPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .node-text {
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      fill: white;
    }
    
    .expand-btn {
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .expand-btn:hover {
      transform: scale(1.1);
    }
    
    .link {
      fill: none;
      stroke: rgba(255, 255, 255, 0.8);
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    
    .drag-preview {
      pointer-events: none;
      opacity: 0.8;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
    }
    
    .status {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      animation: pulse 2s infinite;
      margin-right: 10px;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 完全可工作的拖拽脑图</h1>
    <div class="controls">
      <button class="btn" id="expand-all">全部展开</button>
      <button class="btn" id="collapse-all">全部收起</button>
      <button class="btn" id="center">居中</button>
      <button class="btn" id="reset">重置</button>
    </div>
  </div>
  
  <div class="container">
    <svg id="mindmap"></svg>
  </div>
  
  <div class="status">
    <div style="display: flex; align-items: center;">
      <div class="status-dot"></div>
      <span id="status-text">拖拽脑图就绪</span>
    </div>
    <div>
      <span id="action-log">拖拽非根节点到其他节点上重新组织结构</span>
    </div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  
  <script>
    class WorkingDragMindMap {
      constructor() {
        this.width = window.innerWidth;
        this.height = window.innerHeight - 120;
        this.svg = null;
        this.g = null;
        this.tree = null;
        this.root = null;
        this.draggedNode = null;
        this.dragPreview = null;
        this.i = 0;
        
        this.init();
        this.loadData();
        this.update(this.root);
      }
      
      init() {
        this.svg = d3.select('#mindmap')
          .attr('width', this.width)
          .attr('height', this.height);
        
        this.g = this.svg.append('g')
          .attr('transform', `translate(${this.width / 2}, ${this.height / 2})`);
        
        this.tree = d3.tree()
          .size([this.height - 100, this.width - 300])
          .separation((a, b) => (a.parent == b.parent ? 1 : 2) / a.depth);
        
        const zoom = d3.zoom()
          .scaleExtent([0.1, 4])
          .on('zoom', (event) => {
            this.g.attr('transform', event.transform);
          });
        
        this.svg.call(zoom);
      }
      
      loadData() {
        const treeData = {
          name: "项目A",
          children: [
            {
              name: "需求分析",
              children: [
                { name: "用户故事" },
                { name: "验收标准" },
                { name: "业务流程" }
              ]
            },
            {
              name: "系统设计",
              children: [
                { name: "架构设计" },
                { name: "数据模型" },
                { name: "接口设计" }
              ]
            },
            {
              name: "开发实现",
              children: [
                { name: "前端开发" },
                { name: "后端开发" },
                { name: "数据库设计" }
              ]
            },
            {
              name: "测试部署",
              children: [
                { name: "单元测试" },
                { name: "集成测试" },
                { name: "生产部署" }
              ]
            }
          ]
        };
        
        this.root = d3.hierarchy(treeData, d => d.children);
        this.root.x0 = 0;
        this.root.y0 = 0;
        
        // 初始收起子节点
        this.root.children.forEach(this.collapse.bind(this));
        
        this.updateStatus('数据加载完成', '拖拽非根节点进行重组');
      }
      
      update(source) {
        const treeData = this.tree(this.root);
        const nodes = treeData.descendants();
        const links = treeData.descendants().slice(1);
        
        // 标准化深度
        nodes.forEach(d => { d.y = d.depth * 180; });
        
        // 更新节点
        const node = this.g.selectAll('g.node-group')
          .data(nodes, d => d.id || (d.id = ++this.i));
        
        // 新节点
        const nodeEnter = node.enter().append('g')
          .attr('class', 'node-group')
          .attr('transform', d => `translate(${source.y0},${source.x0})`);
        
        // 节点矩形
        nodeEnter.append('rect')
          .attr('class', 'node-rect')
          .attr('width', 120)
          .attr('height', 40)
          .attr('x', -60)
          .attr('y', -20)
          .style('fill', d => this.getNodeColor(d.depth))
          .style('stroke', d => d3.color(this.getNodeColor(d.depth)).darker());
        
        // 节点文本
        nodeEnter.append('text')
          .attr('class', 'node-text')
          .attr('dy', '.35em')
          .text(d => d.data.name);
        
        // 展开/收起按钮
        const expandGroup = nodeEnter.append('g')
          .attr('class', 'expand-btn')
          .style('display', d => d.children || d._children ? 'block' : 'none');
        
        expandGroup.append('circle')
          .attr('r', 8)
          .attr('cx', 70)
          .attr('cy', 0)
          .style('fill', 'rgba(255, 255, 255, 0.9)')
          .style('stroke', '#333')
          .style('stroke-width', '2px');
        
        expandGroup.append('text')
          .attr('x', 70)
          .attr('y', 0)
          .attr('dy', '.35em')
          .attr('text-anchor', 'middle')
          .style('font-size', '12px')
          .style('font-weight', 'bold')
          .style('fill', '#333')
          .style('pointer-events', 'none')
          .text(d => d.children ? '-' : '+');
        
        // 合并更新
        const nodeUpdate = nodeEnter.merge(node);
        
        nodeUpdate.transition()
          .duration(600)
          .attr('transform', d => `translate(${d.y},${d.x})`);
        
        nodeUpdate.select('.node-rect')
          .style('fill', d => this.getNodeColor(d.depth));
        
        nodeUpdate.select('.expand-btn text')
          .text(d => d.children ? '-' : '+');
        
        // 移除节点
        const nodeExit = node.exit().transition()
          .duration(600)
          .attr('transform', d => `translate(${source.y},${source.x})`)
          .remove();
        
        // 更新连接线
        const link = this.g.selectAll('path.link')
          .data(links, d => d.id);
        
        const linkEnter = link.enter().insert('path', 'g')
          .attr('class', 'link')
          .attr('d', d => {
            const o = {x: source.x0, y: source.y0};
            return this.diagonal(o, o);
          });
        
        const linkUpdate = linkEnter.merge(link);
        
        linkUpdate.transition()
          .duration(600)
          .attr('d', d => this.diagonal(d, d.parent));
        
        link.exit().transition()
          .duration(600)
          .attr('d', d => {
            const o = {x: source.x, y: source.y};
            return this.diagonal(o, o);
          })
          .remove();
        
        // 保存位置
        nodes.forEach(d => {
          d.x0 = d.x;
          d.y0 = d.y;
        });
        
        // 绑定事件
        this.bindEvents();
      }
      
      bindEvents() {
        // 点击展开/收起
        this.g.selectAll('.expand-btn')
          .on('click', (event, d) => {
            event.stopPropagation();
            this.toggleNode(d);
          });
        
        // 拖拽功能
        const drag = d3.drag()
          .on('start', (event, d) => this.dragStart(event, d))
          .on('drag', (event, d) => this.dragging(event, d))
          .on('end', (event, d) => this.dragEnd(event, d));
        
        // 只对非根节点启用拖拽
        this.g.selectAll('.node-rect')
          .classed('draggable', d => d.depth > 0)
          .style('cursor', d => d.depth > 0 ? 'grab' : 'default')
          .call(drag);
      }
      
      dragStart(event, d) {
        if (d.depth === 0) return;
        
        event.sourceEvent.stopPropagation();
        this.draggedNode = d;
        
        // 添加拖拽样式
        d3.select(event.sourceEvent.target).classed('dragging', true);
        
        // 创建拖拽预览
        this.createDragPreview(d);
        
        this.updateStatus('拖拽中...', `正在移动 "${d.data.name}"`);
      }
      
      dragging(event, d) {
        if (d.depth === 0 || !this.draggedNode) return;
        
        // 更新预览位置
        if (this.dragPreview) {
          const [x, y] = d3.pointer(event, this.g.node());
          this.dragPreview.attr('transform', `translate(${x}, ${y})`);
        }
        
        // 高亮拖放目标
        this.highlightDropTarget(event);
      }
      
      dragEnd(event, d) {
        if (d.depth === 0 || !this.draggedNode) return;
        
        // 查找拖放目标
        const target = this.findDropTarget(event);
        
        if (target && target !== d && !this.wouldCreateCycle(d, target)) {
          this.moveNode(d, target);
          this.updateStatus('移动完成', `"${d.data.name}" 移动到 "${target.data.name}" 下`);
        } else {
          this.updateStatus('移动取消', '无效的拖放目标');
        }
        
        // 清理
        this.cleanupDrag();
      }
      
      createDragPreview(d) {
        this.dragPreview = this.g.append('g')
          .attr('class', 'drag-preview');
        
        this.dragPreview.append('rect')
          .attr('width', 120)
          .attr('height', 40)
          .attr('x', -60)
          .attr('y', -20)
          .attr('rx', 8)
          .attr('ry', 8)
          .style('fill', this.getNodeColor(d.depth))
          .style('stroke', '#fff')
          .style('stroke-width', '3px');
        
        this.dragPreview.append('text')
          .attr('dy', '.35em')
          .attr('text-anchor', 'middle')
          .style('fill', 'white')
          .style('font-size', '14px')
          .style('font-weight', '500')
          .text(d.data.name);
      }
      
      highlightDropTarget(event) {
        // 清除高亮
        this.g.selectAll('.node-rect').classed('drop-target', false);
        
        const target = this.findDropTarget(event);
        if (target && target !== this.draggedNode && !this.wouldCreateCycle(this.draggedNode, target)) {
          this.g.selectAll('.node-rect')
            .filter(d => d === target)
            .classed('drop-target', true);
        }
      }
      
      findDropTarget(event) {
        const elements = document.elementsFromPoint(event.sourceEvent.clientX, event.sourceEvent.clientY);
        
        for (let element of elements) {
          if (element.classList.contains('node-rect')) {
            const nodeGroup = element.parentNode;
            const targetData = d3.select(nodeGroup).datum();
            if (targetData && targetData !== this.draggedNode) {
              return targetData;
            }
          }
        }
        
        return null;
      }
      
      cleanupDrag() {
        this.g.selectAll('.node-rect')
          .classed('dragging', false)
          .classed('drop-target', false);
        
        if (this.dragPreview) {
          this.dragPreview.remove();
          this.dragPreview = null;
        }
        
        this.draggedNode = null;
      }
      
      wouldCreateCycle(source, target) {
        let current = target;
        while (current) {
          if (current === source) return true;
          current = current.parent;
        }
        return false;
      }
      
      moveNode(source, target) {
        // 从原父节点移除
        if (source.parent) {
          const siblings = source.parent.children || source.parent._children || [];
          const index = siblings.indexOf(source);
          if (index > -1) {
            siblings.splice(index, 1);
          }
        }
        
        // 添加到新父节点
        if (!target.children && !target._children) {
          target._children = [];
        }
        const targetChildren = target.children || target._children;
        targetChildren.push(source);
        source.parent = target;
        
        // 重新渲染
        this.update(source);
      }
      
      toggleNode(d) {
        if (d.children) {
          d._children = d.children;
          d.children = null;
        } else {
          d.children = d._children;
          d._children = null;
        }
        this.update(d);
      }
      
      collapse(d) {
        if (d.children) {
          d._children = d.children;
          d._children.forEach(this.collapse.bind(this));
          d.children = null;
        }
      }
      
      expand(d) {
        if (d._children) {
          d.children = d._children;
          d.children.forEach(this.expand.bind(this));
          d._children = null;
        }
      }
      
      getNodeColor(depth) {
        const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7'];
        return colors[depth] || '#ddd';
      }
      
      diagonal(s, d) {
        const path = `M ${s.y} ${s.x}
                      C ${(s.y + d.y) / 2} ${s.x},
                        ${(s.y + d.y) / 2} ${d.x},
                        ${d.y} ${d.x}`;
        return path;
      }
      
      expandAll() {
        this.root.descendants().forEach(this.expand.bind(this));
        this.update(this.root);
        this.updateStatus('全部展开', '所有节点已展开');
      }
      
      collapseAll() {
        this.root.children.forEach(this.collapse.bind(this));
        this.update(this.root);
        this.updateStatus('全部收起', '所有子节点已收起');
      }
      
      center() {
        const bounds = this.g.node().getBBox();
        const parent = this.g.node().parentElement;
        const fullWidth = parent.clientWidth;
        const fullHeight = parent.clientHeight;
        const width = bounds.width;
        const height = bounds.height;
        const midX = bounds.x + width / 2;
        const midY = bounds.y + height / 2;
        
        if (width == 0 || height == 0) return;
        
        const scale = 0.8 / Math.max(width / fullWidth, height / fullHeight);
        const translate = [fullWidth / 2 - scale * midX, fullHeight / 2 - scale * midY];
        
        this.svg.transition()
          .duration(750)
          .call(d3.zoom().transform, d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale));
        
        this.updateStatus('视图居中', '脑图已居中显示');
      }
      
      reset() {
        this.loadData();
        this.update(this.root);
        this.updateStatus('数据重置', '恢复到初始状态');
      }
      
      updateStatus(status, action = '') {
        document.getElementById('status-text').textContent = status;
        if (action) {
          document.getElementById('action-log').textContent = action;
        }
      }
    }
    
    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      const mindmap = new WorkingDragMindMap();
      
      // 绑定按钮
      document.getElementById('expand-all').addEventListener('click', () => mindmap.expandAll());
      document.getElementById('collapse-all').addEventListener('click', () => mindmap.collapseAll());
      document.getElementById('center').addEventListener('click', () => mindmap.center());
      document.getElementById('reset').addEventListener('click', () => mindmap.reset());
    });
  </script>
</body>
</html>
