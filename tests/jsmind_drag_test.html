<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jsMind 原生拖拽功能测试</title>
  <link rel="stylesheet" href="../vendor/jsmind/style/jsmind.css" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif; margin: 0; }
    header { padding: 12px 16px; background: #0f172a; color: #fff; }
    header h1 { margin: 0; font-size: 16px; }
    .toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #e5e7eb; background: #f8fafc; }
    .toolbar button { padding: 6px 10px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; }
    .toolbar .hint { color: #475569; font-size: 13px; }
    #container { height: calc(100vh - 110px); }
    #jsmind_container { width: 100%; height: 100%; background: #f1f5f9; }
    /* 防止画布遮挡事件 */
    #jsmind_container canvas { pointer-events: none; }
    .statusbar { padding: 8px 16px; border-top: 1px solid #e5e7eb; font-size: 13px; color: #334155; background: #f8fafc; display:flex; justify-content: space-between; }
    .ok { color: #16a34a; }
    .warn { color: #b45309; }
  </style>
</head>
<body>
  <header>
    <h1>jsMind 原生拖拽功能测试</h1>
  </header>

  <div class="toolbar">
    <button id="btn-reset">重置数据</button>
    <button id="btn-expand">全部展开</button>
    <button id="btn-collapse">全部收起</button>
    <span class="hint">提示：按住节点左键拖拽，可改变父子关系或同层顺序；根节点不可拖拽。</span>
  </div>

  <div id="container">
    <div id="jsmind_container"></div>
  </div>

  <div class="statusbar">
    <div>拖拽状态：<span id="drag-status" class="warn">等待操作</span></div>
    <div>最近一次移动：<span id="last-move">-</span></div>
  </div>

  <script src="../vendor/jsmind/js/jsmind.js"></script>
  <!-- 原生拖拽兼容补丁：为 jsMind 0.4.12 添加 draggable 插件所需的接口 -->
  <script>
    (function() {
      if (window.jsMind) {
        // 添加 util.canvas 工具方法
        jsMind.util = jsMind.util || {};
        if (!jsMind.util.canvas) {
          jsMind.util.canvas = {
            clear: function(ctx, x, y, w, h) {
              if (ctx && ctx.clearRect) {
                ctx.clearRect(x || 0, y || 0, w || ctx.canvas.width, h || ctx.canvas.height);
              }
            },
            lineto: function(ctx, x1, y1, x2, y2) {
              if (ctx) {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
              }
            }
          };
        }
        
        // 添加 get_node_from_element 方法
        if (typeof jsMind.prototype.get_node_from_element !== 'function') {
          jsMind.prototype.get_node_from_element = function(element) {
            if (!element || !this.view) return null;
            
            // 向上查找包含 nodeid 的元素
            var current = element;
            while (current && current !== this.view.container) {
              if (current.getAttribute && current.getAttribute('nodeid')) {
                var nodeid = current.getAttribute('nodeid');
                return this.get_node(nodeid);
              }
      }
      
      // 2. 添加 util.canvas 工具方法
      jsMind.util = jsMind.util || {};
      if (!jsMind.util.canvas) {
        jsMind.util.canvas = {
          clear: function(ctx, x, y, w, h) {
            if (ctx && ctx.clearRect) {
              ctx.clearRect(x || 0, y || 0, w || ctx.canvas.width, h || ctx.canvas.height);
            }
          },
          lineto: function(ctx, x1, y1, x2, y2) {
            if (ctx) {
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();
            }
          }
        };
      }
    }
  </script>
  <script src="../vendor/jsmind/js/jsmind.draggable.js"></script>
  <script>
    (function() {
      const containerId = 'jsmind_container';
      const options = {
        container: containerId,
        editable: true,       // 允许编辑（启用拖拽的前提）
        theme: 'primary',
      };

      // 准备一份基础测试数据
      const mindData = {
        meta: { name: 'drag_test', author: 'qa', version: '1.0' },
        format: 'node_array',
        data: [
          { id: 'root', isroot: true, topic: '项目A' },
          { id: 'n1', parentid: 'root', topic: '需求' },
          { id: 'n1-1', parentid: 'n1', topic: '用户故事' },
          { id: 'n1-2', parentid: 'n1', topic: '验收标准' },
          { id: 'n2', parentid: 'root', topic: '设计' },
          { id: 'n2-1', parentid: 'n2', topic: '系统架构' },
          { id: 'n2-2', parentid: 'n2', topic: '数据模型' },
          { id: 'n3', parentid: 'root', topic: '实现' },
          { id: 'n3-1', parentid: 'n3', topic: '前端' },
          { id: 'n3-2', parentid: 'n3', topic: '后端' },
        ]
      };

      let jm = null;
      const $ = (id) => document.getElementById(id);
      const $status = $('drag-status');
      const $last = $('last-move');

      function renderMind() {
        if (jm) { jm.destroy(); jm = null; }
        jm = new jsMind(options);
        jm.show(mindData);
        // 初始化一次尺寸，确保 draggable 画布有正确宽高
        if (typeof jm.resize === 'function') { jm.resize(); }
        // jsmind.draggable.js 插件会在 editable=true 时自动启用拖拽
        bindDragFeedback(jm);
      }

      function bindDragFeedback(jm) {
        // 使用原生事件监听拖拽状态
        const container = document.getElementById(containerId);
        let isDragging = false;
        let draggedNode = null;
        
        // 监听拖拽开始和结束
        container.addEventListener('mousedown', (e) => {
          const target = e.target;
          if (target && target.getAttribute && target.getAttribute('nodeid')) {
            isDragging = true;
            draggedNode = jm.get_node(target.getAttribute('nodeid'));
            $status.textContent = '拖拽中…';
            $status.className = 'ok';
          }
        });
        
        container.addEventListener('mouseup', () => {
          if (isDragging) {
            setTimeout(() => {
              $status.textContent = '等待操作';
              $status.className = 'warn';
              isDragging = false;
              draggedNode = null;
            }, 100);
          }
        });
        
        // 使用原生 move_node 拦截来监听移动事件（保持最小侵入性）
        const originalMoveNode = jm.move_node.bind(jm);
        jm.move_node = function(nodeId, beforeId, parentId, direction) {
          const node = jm.get_node(nodeId);
          const oldParent = node ? node.parent : null;
          const result = originalMoveNode(nodeId, beforeId, parentId, direction);
          
          // 移动完成后更新状态
          setTimeout(() => {
            const movedNode = jm.get_node(nodeId);
            const newParent = movedNode ? movedNode.parent : null;
            
            if (oldParent && newParent && oldParent.id !== newParent.id) {
              $last.textContent = `节点 "${movedNode.topic}" 从 "${oldParent.topic}" 移动到 "${newParent.topic}"`;
            } else if (oldParent && newParent && oldParent.id === newParent.id) {
              $last.textContent = `节点 "${movedNode.topic}" 在 "${newParent.topic}" 下调整顺序`;
            } else {
              $last.textContent = `节点 "${movedNode.topic}" 位置已更新`;
            }
          }, 50);
          
          return result;
        };
      }

      // 工具条
      $('btn-reset').addEventListener('click', renderMind);
      $('btn-expand').addEventListener('click', () => jm && jm.expand_all());
      $('btn-collapse').addEventListener('click', () => jm && jm.collapse_all());

      // 首次渲染
      renderMind();
      // 再触发一次 resize 以防第一帧未完成布局
      setTimeout(() => { if (typeof jm?.resize === 'function') jm.resize(); }, 0);
    })();
  </script>
</body>
</html>
