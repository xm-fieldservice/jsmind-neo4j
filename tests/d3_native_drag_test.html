<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3.js 原生拖拽脑图 - 本地版本</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      overflow: hidden;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 15px 25px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    
    .controls {
      display: flex;
      gap: 12px;
    }
    
    .btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
      font-weight: 500;
    }
    
    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    .container {
      height: calc(100vh - 120px);
      position: relative;
    }
    
    #mindmap {
      width: 100%;
      height: 100%;
    }
    
    .node {
      fill: white;
      stroke: #333;
      stroke-width: 2;
      cursor: grab;
      transition: all 0.3s ease;
    }
    
    .node:hover {
      fill: #f0f8ff;
      stroke-width: 3;
    }
    
    .node.dragging {
      fill: #ffeb3b;
      stroke: #ff5722;
      stroke-width: 4;
      cursor: grabbing;
    }
    
    .node.drop-target {
      fill: #e8f5e8;
      stroke: #4caf50;
      stroke-width: 4;
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .node-text {
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      fill: #333;
    }
    
    .link {
      fill: none;
      stroke: rgba(255, 255, 255, 0.8);
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    
    .link.highlight {
      stroke: #00ff88;
      stroke-width: 4;
    }
    
    .status {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      animation: pulse 2s infinite;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧠 D3.js 原生拖拽脑图 - 本地版本</h1>
    <div class="controls">
      <button class="btn" id="center">居中</button>
      <button class="btn" id="reset">重置</button>
      <button class="btn" id="expand">展开</button>
      <button class="btn" id="collapse">收起</button>
    </div>
  </div>
  
  <div class="container">
    <svg id="mindmap"></svg>
  </div>
  
  <div class="status">
    <div style="display: flex; align-items: center;">
      <div class="status-dot"></div>
      <span id="status-text">D3.js 原生拖拽就绪</span>
    </div>
    <div>
      <span id="action-log">拖拽节点重新组织结构</span>
    </div>
  </div>

  <!-- 使用本地 D3.js -->
  <script src="../vendor/d3/d3.min.js"></script>
  <script>
    // 如果本地 D3 不存在，使用 CDN 备用
    if (typeof d3 === 'undefined') {
      document.write('<script src="https://d3js.org/d3.v7.min.js"><\/script>');
    }
  </script>
  
  <script>
    class D3MindMap {
      constructor() {
        this.width = window.innerWidth;
        this.height = window.innerHeight - 120;
        this.svg = null;
        this.g = null;
        this.nodes = [];
        this.links = [];
        this.simulation = null;
        this.draggedNode = null;
        
        this.init();
        this.loadData();
        this.render();
      }
      
      init() {
        // 创建 SVG
        this.svg = d3.select('#mindmap')
          .attr('width', this.width)
          .attr('height', this.height);
        
        // 创建主容器组
        this.g = this.svg.append('g');
        
        // 添加缩放和平移
        const zoom = d3.zoom()
          .scaleExtent([0.1, 4])
          .on('zoom', (event) => {
            this.g.attr('transform', event.transform);
          });
        
        this.svg.call(zoom);
        
        // 绑定窗口大小变化
        window.addEventListener('resize', () => this.handleResize());
      }
      
      loadData() {
        // 创建测试数据
        this.nodes = [
          { id: 'root', name: '项目A', level: 0, x: this.width/2, y: this.height/2, fx: this.width/2, fy: this.height/2 },
          { id: 'req', name: '需求分析', level: 1, parent: 'root' },
          { id: 'design', name: '系统设计', level: 1, parent: 'root' },
          { id: 'dev', name: '开发实现', level: 1, parent: 'root' },
          { id: 'test', name: '测试部署', level: 1, parent: 'root' },
          { id: 'story', name: '用户故事', level: 2, parent: 'req' },
          { id: 'accept', name: '验收标准', level: 2, parent: 'req' },
          { id: 'arch', name: '架构设计', level: 2, parent: 'design' },
          { id: 'data', name: '数据模型', level: 2, parent: 'design' },
          { id: 'frontend', name: '前端开发', level: 2, parent: 'dev' },
          { id: 'backend', name: '后端开发', level: 2, parent: 'dev' },
          { id: 'unit', name: '单元测试', level: 2, parent: 'test' },
          { id: 'deploy', name: '生产部署', level: 2, parent: 'test' }
        ];
        
        // 创建连接关系
        this.links = [];
        this.nodes.forEach(node => {
          if (node.parent) {
            this.links.push({
              source: node.parent,
              target: node.id
            });
          }
        });
        
        this.updateStatus('数据加载完成', `${this.nodes.length} 个节点，${this.links.length} 条连接`);
      }
      
      render() {
        // 清空现有内容
        this.g.selectAll('*').remove();
        
        // 创建力导向布局
        this.simulation = d3.forceSimulation(this.nodes)
          .force('link', d3.forceLink(this.links).id(d => d.id).distance(120))
          .force('charge', d3.forceManyBody().strength(-300))
          .force('center', d3.forceCenter(this.width / 2, this.height / 2))
          .force('collision', d3.forceCollide().radius(50));
        
        // 渲染连接线
        this.linkElements = this.g.selectAll('.link')
          .data(this.links)
          .enter()
          .append('path')
          .attr('class', 'link')
          .attr('marker-end', 'url(#arrowhead)');
        
        // 添加箭头标记
        this.svg.append('defs').append('marker')
          .attr('id', 'arrowhead')
          .attr('viewBox', '-0 -5 10 10')
          .attr('refX', 25)
          .attr('refY', 0)
          .attr('orient', 'auto')
          .attr('markerWidth', 8)
          .attr('markerHeight', 8)
          .append('path')
          .attr('d', 'M 0,-5 L 10 ,0 L 0,5')
          .attr('fill', 'rgba(255, 255, 255, 0.8)');
        
        // 渲染节点组
        this.nodeGroups = this.g.selectAll('.node-group')
          .data(this.nodes)
          .enter()
          .append('g')
          .attr('class', 'node-group');
        
        // 添加节点圆形
        this.nodeElements = this.nodeGroups
          .append('circle')
          .attr('class', 'node')
          .attr('r', d => d.level === 0 ? 30 : 20)
          .style('fill', d => this.getNodeColor(d.level));
        
        // 添加节点文本
        this.textElements = this.nodeGroups
          .append('text')
          .attr('class', 'node-text')
          .text(d => d.name)
          .style('font-size', d => d.level === 0 ? '16px' : '12px')
          .style('font-weight', d => d.level === 0 ? 'bold' : 'normal');
        
        // 启用拖拽
        this.enableDragging();
        
        // 启动仿真
        this.simulation.on('tick', () => this.ticked());
        
        this.updateStatus('渲染完成', '可以开始拖拽节点了');
      }
      
      getNodeColor(level) {
        const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7'];
        return colors[level] || '#ddd';
      }
      
      enableDragging() {
        const drag = d3.drag()
          .on('start', (event, d) => this.dragStart(event, d))
          .on('drag', (event, d) => this.dragging(event, d))
          .on('end', (event, d) => this.dragEnd(event, d));
        
        this.nodeGroups.call(drag);
      }
      
      dragStart(event, d) {
        if (d.id === 'root') return; // 根节点不可拖拽
        
        if (!event.active) this.simulation.alphaTarget(0.3).restart();
        
        this.draggedNode = d;
        
        // 视觉反馈
        d3.select(event.sourceEvent.target).classed('dragging', true);
        
        // 高亮相关连接
        this.highlightConnections(d);
        
        this.updateStatus('拖拽开始', `正在移动 "${d.name}"`);
      }
      
      dragging(event, d) {
        if (d.id === 'root') return;
        
        d.fx = event.x;
        d.fy = event.y;
        
        // 检测拖放目标
        this.updateDropTargets(event);
      }
      
      dragEnd(event, d) {
        if (d.id === 'root') return;
        
        if (!event.active) this.simulation.alphaTarget(0);
        
        // 查找拖放目标
        const target = this.findDropTarget(event);
        
        if (target && target !== d && !this.wouldCreateCycle(d, target)) {
          // 执行移动
          this.moveNode(d, target);
          this.updateStatus('移动完成', `"${d.name}" 移动到 "${target.name}" 下`);
        } else {
          this.updateStatus('移动取消', '无效的拖放目标');
        }
        
        // 清理视觉状态
        this.svg.selectAll('.node').classed('dragging', false).classed('drop-target', false);
        this.svg.selectAll('.link').classed('highlight', false);
        
        // 释放固定位置
        d.fx = null;
        d.fy = null;
        
        this.draggedNode = null;
        
        // 重新渲染连接
        setTimeout(() => this.updateLinks(), 100);
      }
      
      findDropTarget(event) {
        const [x, y] = d3.pointer(event.sourceEvent, this.svg.node());
        
        // 查找最近的节点
        let minDistance = Infinity;
        let target = null;
        
        this.nodes.forEach(node => {
          if (node === this.draggedNode) return;
          
          const distance = Math.sqrt(
            Math.pow(node.x - x, 2) + Math.pow(node.y - y, 2)
          );
          
          if (distance < 50 && distance < minDistance) {
            minDistance = distance;
            target = node;
          }
        });
        
        return target;
      }
      
      updateDropTargets(event) {
        // 清除之前的高亮
        this.svg.selectAll('.node').classed('drop-target', false);
        
        const target = this.findDropTarget(event);
        if (target) {
          // 高亮目标节点
          this.nodeGroups
            .filter(d => d === target)
            .select('.node')
            .classed('drop-target', true);
        }
      }
      
      wouldCreateCycle(source, target) {
        // 简单的循环检测
        const visited = new Set();
        let current = target;
        
        while (current && !visited.has(current.id)) {
          if (current.id === source.id) return true;
          visited.add(current.id);
          current = this.nodes.find(n => n.id === current.parent);
        }
        
        return false;
      }
      
      moveNode(source, target) {
        // 更新父子关系
        source.parent = target.id;
        source.level = target.level + 1;
        
        // 重新计算连接
        this.updateLinks();
      }
      
      updateLinks() {
        // 重新生成连接数据
        this.links = [];
        this.nodes.forEach(node => {
          if (node.parent) {
            this.links.push({
              source: node.parent,
              target: node.id
            });
          }
        });
        
        // 更新仿真
        this.simulation.force('link').links(this.links);
        this.simulation.alpha(1).restart();
        
        // 重新绑定连接线数据
        this.linkElements = this.linkElements.data(this.links);
        this.linkElements.exit().remove();
        this.linkElements = this.linkElements.enter()
          .append('path')
          .attr('class', 'link')
          .merge(this.linkElements);
      }
      
      highlightConnections(node) {
        this.svg.selectAll('.link')
          .classed('highlight', d => 
            d.source.id === node.id || d.target.id === node.id
          );
      }
      
      ticked() {
        // 更新连接线位置
        this.linkElements.attr('d', d => {
          const source = typeof d.source === 'object' ? d.source : this.nodes.find(n => n.id === d.source);
          const target = typeof d.target === 'object' ? d.target : this.nodes.find(n => n.id === d.target);
          
          if (!source || !target) return '';
          
          // 创建弯曲的连接线
          const dx = target.x - source.x;
          const dy = target.y - source.y;
          const dr = Math.sqrt(dx * dx + dy * dy) * 0.3;
          
          return `M${source.x},${source.y}A${dr},${dr} 0 0,1 ${target.x},${target.y}`;
        });
        
        // 更新节点位置
        this.nodeGroups.attr('transform', d => `translate(${d.x},${d.y})`);
      }
      
      center() {
        // 居中显示
        const transform = d3.zoomIdentity.translate(this.width / 2, this.height / 2).scale(1);
        this.svg.transition().duration(750).call(
          d3.zoom().transform, transform
        );
        this.updateStatus('视图居中', '脑图已居中显示');
      }
      
      reset() {
        this.loadData();
        this.render();
        this.updateStatus('数据重置', '恢复到初始状态');
      }
      
      expand() {
        // 展开所有节点（增加力的强度）
        this.simulation.force('charge').strength(-500);
        this.simulation.alpha(1).restart();
        this.updateStatus('节点展开', '增加节点间距');
      }
      
      collapse() {
        // 收起节点（减少力的强度）
        this.simulation.force('charge').strength(-200);
        this.simulation.alpha(1).restart();
        this.updateStatus('节点收起', '减少节点间距');
      }
      
      handleResize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight - 120;
        
        this.svg
          .attr('width', this.width)
          .attr('height', this.height);
        
        this.simulation
          .force('center', d3.forceCenter(this.width / 2, this.height / 2))
          .alpha(1).restart();
      }
      
      updateStatus(status, action = '') {
        document.getElementById('status-text').textContent = status;
        if (action) {
          document.getElementById('action-log').textContent = action;
        }
      }
    }
    
    // 等待 D3 加载完成后初始化
    function initMindMap() {
      if (typeof d3 !== 'undefined') {
        new D3MindMap();
        
        // 绑定控制按钮
        document.getElementById('center').addEventListener('click', () => window.mindmap?.center());
        document.getElementById('reset').addEventListener('click', () => window.mindmap?.reset());
        document.getElementById('expand').addEventListener('click', () => window.mindmap?.expand());
        document.getElementById('collapse').addEventListener('click', () => window.mindmap?.collapse());
        
        // 保存实例到全局
        window.mindmap = new D3MindMap();
      } else {
        setTimeout(initMindMap, 100);
      }
    }
    
    // 页面加载完成后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMindMap);
    } else {
      initMindMap();
    }
  </script>
</body>
</html>
