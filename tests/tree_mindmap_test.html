<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3.js 树状脑图 - 真正的脑图布局</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      overflow: hidden;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 15px 25px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    
    .controls {
      display: flex;
      gap: 12px;
    }
    
    .btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
      font-weight: 500;
    }
    
    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    .container {
      height: calc(100vh - 120px);
      position: relative;
    }
    
    #mindmap {
      width: 100%;
      height: 100%;
    }
    
    .node {
      cursor: grab;
      transition: all 0.3s ease;
    }
    
    .node:hover {
      filter: brightness(1.1);
    }
    
    .node.dragging {
      cursor: grabbing;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
    }
    
    .node.drop-target .node-rect {
      stroke: #00ff88 !important;
      stroke-width: 4px !important;
      filter: drop-shadow(0 0 10px #00ff88);
      animation: pulse 1s infinite;
    }
    
    .node.dragging .node-rect {
      stroke: #ff6b6b !important;
      stroke-width: 4px !important;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.8; }
    }
    
    .drag-preview {
      filter: drop-shadow(0 6px 15px rgba(0,0,0,0.5));
      animation: dragFloat 0.3s ease-out;
    }
    
    @keyframes dragFloat {
      from { transform: scale(0.9); opacity: 0.5; }
      to { transform: scale(1); opacity: 0.8; }
    }
    
    .node-rect {
      rx: 8;
      ry: 8;
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    
    .node-text {
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      fill: white;
    }
    
    .link {
      fill: none;
      stroke: rgba(255, 255, 255, 0.8);
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    
    .link.highlight {
      stroke: #00ff88;
      stroke-width: 4;
    }
    
    .status {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      animation: pulse 2s infinite;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌳 D3.js 树状脑图 - 真正的脑图布局</h1>
    <div class="controls">
      <button class="btn" id="expand-all">全部展开</button>
      <button class="btn" id="collapse-all">全部收起</button>
      <button class="btn" id="center">居中</button>
      <button class="btn" id="reset">重置</button>
    </div>
  </div>
  
  <div class="container">
    <svg id="mindmap"></svg>
  </div>
  
  <div class="status">
    <div style="display: flex; align-items: center;">
      <div class="status-dot"></div>
      <span id="status-text">树状脑图就绪</span>
    </div>
    <div>
      <span id="action-log">点击节点展开/收起，拖拽重新组织</span>
    </div>
  </div>

  <!-- 使用 CDN D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  
  <script>
    class TreeMindMap {
      constructor() {
        this.width = window.innerWidth;
        this.height = window.innerHeight - 120;
        this.svg = null;
        this.g = null;
        this.tree = null;
        this.root = null;
        this.draggedNode = null;
        this.i = 0; // 用于生成唯一ID
        
        this.init();
        this.loadData();
        this.update(this.root);
      }
      
      init() {
        // 创建 SVG
        this.svg = d3.select('#mindmap')
          .attr('width', this.width)
          .attr('height', this.height);
        
        // 创建主容器组
        this.g = this.svg.append('g')
          .attr('transform', `translate(${this.width / 2}, ${this.height / 2})`);
        
        // 创建树布局
        this.tree = d3.tree()
          .size([this.height - 100, this.width - 200])
          .separation((a, b) => (a.parent == b.parent ? 1 : 2) / a.depth);
        
        // 添加缩放和平移
        const zoom = d3.zoom()
          .scaleExtent([0.1, 4])
          .on('zoom', (event) => {
            this.g.attr('transform', event.transform);
          });
        
        this.svg.call(zoom);
        
        // 绑定窗口大小变化
        window.addEventListener('resize', () => this.handleResize());
      }
      
      loadData() {
        // 创建层次化的脑图数据
        const treeData = {
          name: "项目A",
          children: [
            {
              name: "需求分析",
              children: [
                { name: "用户故事" },
                { name: "验收标准" },
                { name: "业务流程" }
              ]
            },
            {
              name: "系统设计",
              children: [
                { name: "架构设计" },
                { name: "数据模型" },
                { name: "接口设计" }
              ]
            },
            {
              name: "开发实现",
              children: [
                { name: "前端开发" },
                { name: "后端开发" },
                { name: "数据库设计" }
              ]
            },
            {
              name: "测试部署",
              children: [
                { name: "单元测试" },
                { name: "集成测试" },
                { name: "生产部署" }
              ]
            }
          ]
        };
        
        // 将数据转换为 D3 层次结构
        this.root = d3.hierarchy(treeData, d => d.children);
        this.root.x0 = 0;
        this.root.y0 = 0;
        
        // 初始时收起所有子节点（除了第一层）
        this.root.children.forEach(this.collapse.bind(this));
        
        this.updateStatus('数据加载完成', '点击节点可展开/收起子节点');
      }
      
      update(source) {
        // 计算新的树布局
        const treeData = this.tree(this.root);
        
        // 计算节点位置
        const nodes = treeData.descendants();
        const links = treeData.descendants().slice(1);
        
        // 标准化固定深度
        nodes.forEach(d => { d.y = d.depth * 200; });
        
        // 更新节点
        const node = this.g.selectAll('g.node')
          .data(nodes, d => d.id || (d.id = ++this.i));
        
        // 进入新节点
        const nodeEnter = node.enter().append('g')
          .attr('class', 'node')
          .attr('transform', d => `translate(${source.y0},${source.x0})`)
          .on('click', (event, d) => this.click(event, d));
        
        // 添加节点矩形
        nodeEnter.append('rect')
          .attr('class', 'node-rect')
          .attr('width', 120)
          .attr('height', 40)
          .attr('x', -60)
          .attr('y', -20)
          .style('fill', d => this.getNodeColor(d.depth))
          .style('stroke', d => d3.color(this.getNodeColor(d.depth)).darker());
        
        // 添加节点文本
        nodeEnter.append('text')
          .attr('class', 'node-text')
          .attr('dy', '.35em')
          .text(d => d.data.name);
        
        // 添加展开/收起指示器
        nodeEnter.append('circle')
          .attr('class', 'toggle')
          .attr('r', 8)
          .attr('cx', 60)
          .attr('cy', 0)
          .style('fill', 'rgba(255, 255, 255, 0.8)')
          .style('stroke', '#333')
          .style('cursor', 'pointer')
          .style('display', d => d.children || d._children ? 'block' : 'none');
        
        nodeEnter.append('text')
          .attr('class', 'toggle-text')
          .attr('x', 60)
          .attr('y', 0)
          .attr('dy', '.35em')
          .attr('text-anchor', 'middle')
          .style('font-size', '12px')
          .style('font-weight', 'bold')
          .style('fill', '#333')
          .style('pointer-events', 'none')
          .text(d => d.children ? '-' : '+')
          .style('display', d => d.children || d._children ? 'block' : 'none');
        
        // 更新现有节点
        const nodeUpdate = nodeEnter.merge(node);
        
        // 过渡到新位置
        nodeUpdate.transition()
          .duration(600)
          .attr('transform', d => `translate(${d.y},${d.x})`);
        
        // 更新节点样式
        nodeUpdate.select('.node-rect')
          .style('fill', d => this.getNodeColor(d.depth));
        
        nodeUpdate.select('.toggle-text')
          .text(d => d.children ? '-' : '+');
        
        // 移除退出的节点
        const nodeExit = node.exit().transition()
          .duration(600)
          .attr('transform', d => `translate(${source.y},${source.x})`)
          .remove();
        
        nodeExit.select('.node-rect')
          .attr('width', 0)
          .attr('height', 0);
        
        nodeExit.select('.node-text')
          .style('fill-opacity', 0);
        
        // 更新连接线
        const link = this.g.selectAll('path.link')
          .data(links, d => d.id);
        
        // 进入新连接线
        const linkEnter = link.enter().insert('path', 'g')
          .attr('class', 'link')
          .attr('d', d => {
            const o = {x: source.x0, y: source.y0};
            return this.diagonal(o, o);
          });
        
        // 更新现有连接线
        const linkUpdate = linkEnter.merge(link);
        
        linkUpdate.transition()
          .duration(600)
          .attr('d', d => this.diagonal(d, d.parent));
        
        // 移除退出的连接线
        link.exit().transition()
          .duration(600)
          .attr('d', d => {
            const o = {x: source.x, y: source.y};
            return this.diagonal(o, o);
          })
          .remove();
        
        // 保存旧位置用于过渡
        nodes.forEach(d => {
          d.x0 = d.x;
          d.y0 = d.y;
        });
        
        // 延迟启用拖拽，确保DOM更新完成
        setTimeout(() => this.enableDragging(), 100);
      }
      
      diagonal(s, d) {
        // 创建平滑的连接线
        const path = `M ${s.y} ${s.x}
                      C ${(s.y + d.y) / 2} ${s.x},
                        ${(s.y + d.y) / 2} ${d.x},
                        ${d.y} ${d.x}`;
        return path;
      }
      
      click(event, d) {
        if (d.children) {
          d._children = d.children;
          d.children = null;
        } else {
          d.children = d._children;
          d._children = null;
        }
        this.update(d);
        
        const action = d.children ? '展开' : '收起';
        this.updateStatus(`${action}节点`, `"${d.data.name}" 已${action}`);
      }
      
      collapse(d) {
        if (d.children) {
          d._children = d.children;
          d._children.forEach(this.collapse.bind(this));
          d.children = null;
        }
      }
      
      expand(d) {
        if (d._children) {
          d.children = d._children;
          d.children.forEach(this.expand.bind(this));
          d._children = null;
        }
      }
      
      getNodeColor(depth) {
        const colors = [
          '#ff6b6b',  // 根节点 - 红色
          '#4ecdc4',  // 第一层 - 青色
          '#45b7d1',  // 第二层 - 蓝色
          '#96ceb4',  // 第三层 - 绿色
          '#ffeaa7'   // 第四层 - 黄色
        ];
        return colors[depth] || '#ddd';
      }
      
      enableDragging() {
        const drag = d3.drag()
          .filter((event, d) => {
            // 只允许在节点矩形上拖拽，避免与点击事件冲突
            return event.target.classList.contains('node-rect') && d.depth > 0;
          })
          .on('start', (event, d) => this.dragStart(event, d))
          .on('drag', (event, d) => this.dragging(event, d))
          .on('end', (event, d) => this.dragEnd(event, d));
        
        // 只对节点矩形应用拖拽
        this.g.selectAll('.node-rect').call(drag);
        
        // 为节点矩形添加拖拽提示
        this.g.selectAll('.node-rect')
          .style('cursor', d => d.depth > 0 ? 'grab' : 'default')
          .on('mouseenter', function(event, d) {
            if (d.depth > 0) {
              d3.select(this).style('stroke-width', '3px');
            }
          })
          .on('mouseleave', function(event, d) {
            if (!d3.select(this.parentNode).classed('dragging')) {
              d3.select(this).style('stroke-width', '2px');
            }
          });
      }
      
      dragStart(event, d) {
        if (d.depth === 0) return;
        
        // 阻止事件冒泡，避免与点击事件冲突
        event.sourceEvent.stopPropagation();
        
        this.draggedNode = d;
        const nodeGroup = d3.select(event.sourceEvent.target.parentNode);
        
        // 添加拖拽样式
        nodeGroup.classed('dragging', true);
        nodeGroup.select('.node-rect')
          .style('cursor', 'grabbing')
          .style('stroke-width', '4px')
          .style('filter', 'drop-shadow(0 4px 8px rgba(0,0,0,0.3))');
        
        // 创建拖拽预览
        this.createDragPreview(event, d);
        
        this.updateStatus('拖拽中...', `正在移动 "${d.data.name}"`);
      }
      
      dragging(event, d) {
        if (d.depth === 0) return;
        
        // 更新拖拽预览位置
        this.updateDragPreview(event);
        
        // 检测并高亮拖放目标
        this.highlightDropTarget(event, d);
      }
      
      dragEnd(event, d) {
        if (d.depth === 0) return;
        
        // 移除拖拽预览
        this.removeDragPreview();
        
        // 查找拖放目标
        const target = this.findDropTarget(event);
        
        if (target && target !== d && !this.wouldCreateCycle(d, target)) {
          this.moveNode(d, target);
          this.updateStatus('移动完成', `"${d.data.name}" 移动到 "${target.data.name}" 下`);
        } else {
          this.updateStatus('移动取消', '无效的拖放目标或位置');
        }
        
        // 清理拖拽状态
        this.cleanupDragState();
        this.draggedNode = null;
      }
      
      createDragPreview(event, d) {
        // 创建拖拽时的预览元素
        this.dragPreview = this.g.append('g')
          .attr('class', 'drag-preview')
          .style('pointer-events', 'none')
          .style('opacity', '0.8');
        
        this.dragPreview.append('rect')
          .attr('width', 120)
          .attr('height', 40)
          .attr('x', -60)
          .attr('y', -20)
          .attr('rx', 8)
          .attr('ry', 8)
          .style('fill', this.getNodeColor(d.depth))
          .style('stroke', '#fff')
          .style('stroke-width', '3px')
          .style('filter', 'drop-shadow(0 6px 12px rgba(0,0,0,0.4))');
        
        this.dragPreview.append('text')
          .attr('dy', '.35em')
          .attr('text-anchor', 'middle')
          .style('fill', 'white')
          .style('font-size', '14px')
          .style('font-weight', '500')
          .text(d.data.name);
      }
      
      updateDragPreview(event) {
        if (this.dragPreview) {
          const [x, y] = d3.pointer(event, this.g.node());
          this.dragPreview.attr('transform', `translate(${x}, ${y})`);
        }
      }
      
      removeDragPreview() {
        if (this.dragPreview) {
          this.dragPreview.remove();
          this.dragPreview = null;
        }
      }
      
      highlightDropTarget(event, draggedNode) {
        // 清除之前的高亮
        this.g.selectAll('.node').classed('drop-target', false);
        
        const target = this.findDropTarget(event);
        if (target && target !== draggedNode && !this.wouldCreateCycle(draggedNode, target)) {
          // 高亮有效的拖放目标
          this.g.selectAll('.node')
            .filter(d => d === target)
            .classed('drop-target', true);
        }
      }
      
      cleanupDragState() {
        // 清理所有拖拽相关的样式
        this.g.selectAll('.node')
          .classed('dragging', false)
          .classed('drop-target', false);
        
        this.g.selectAll('.node-rect')
          .style('cursor', d => d.depth > 0 ? 'grab' : 'default')
          .style('stroke-width', '2px')
          .style('filter', null);
      }
      
      findDropTarget(event) {
        // 获取鼠标位置下的所有元素
        const elements = document.elementsFromPoint(event.sourceEvent.clientX, event.sourceEvent.clientY);
        
        // 查找目标节点（排除当前拖拽的节点）
        for (let element of elements) {
          const nodeElement = element.closest('.node');
          if (nodeElement) {
            const targetNode = d3.select(nodeElement).datum();
            if (targetNode && targetNode !== this.draggedNode) {
              return targetNode;
            }
          }
        }
        
        return null;
      }
      
      wouldCreateCycle(source, target) {
        // 检查是否会创建循环
        let current = target;
        while (current) {
          if (current === source) return true;
          current = current.parent;
        }
        return false;
      }
      
      moveNode(source, target) {
        // 从原父节点移除
        if (source.parent) {
          const siblings = source.parent.children || source.parent._children || [];
          const index = siblings.indexOf(source);
          if (index > -1) {
            siblings.splice(index, 1);
          }
        }
        
        // 添加到新父节点
        if (!target.children && !target._children) {
          target._children = [];
        }
        const targetChildren = target.children || target._children;
        targetChildren.push(source);
        source.parent = target;
        
        // 重新计算层次
        this.updateDepth(source, target.depth + 1);
        
        // 重新渲染
        this.update(source);
      }
      
      updateDepth(node, depth) {
        node.depth = depth;
        if (node.children) {
          node.children.forEach(child => this.updateDepth(child, depth + 1));
        }
        if (node._children) {
          node._children.forEach(child => this.updateDepth(child, depth + 1));
        }
      }
      
      expandAll() {
        this.root.descendants().forEach(this.expand.bind(this));
        this.update(this.root);
        this.updateStatus('全部展开', '所有节点已展开');
      }
      
      collapseAll() {
        this.root.children.forEach(this.collapse.bind(this));
        this.update(this.root);
        this.updateStatus('全部收起', '所有子节点已收起');
      }
      
      center() {
        const bounds = this.g.node().getBBox();
        const parent = this.g.node().parentElement;
        const fullWidth = parent.clientWidth || parent.parentNode.clientWidth;
        const fullHeight = parent.clientHeight || parent.parentNode.clientHeight;
        const width = bounds.width;
        const height = bounds.height;
        const midX = bounds.x + width / 2;
        const midY = bounds.y + height / 2;
        
        if (width == 0 || height == 0) return;
        
        const scale = 0.8 / Math.max(width / fullWidth, height / fullHeight);
        const translate = [fullWidth / 2 - scale * midX, fullHeight / 2 - scale * midY];
        
        this.svg.transition()
          .duration(750)
          .call(d3.zoom().transform, d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale));
        
        this.updateStatus('视图居中', '脑图已居中显示');
      }
      
      reset() {
        this.loadData();
        this.update(this.root);
        this.updateStatus('数据重置', '恢复到初始状态');
      }
      
      handleResize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight - 120;
        
        this.svg
          .attr('width', this.width)
          .attr('height', this.height);
        
        this.tree.size([this.height - 100, this.width - 200]);
        this.update(this.root);
      }
      
      updateStatus(status, action = '') {
        document.getElementById('status-text').textContent = status;
        if (action) {
          document.getElementById('action-log').textContent = action;
        }
      }
    }
    
    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
      const mindmap = new TreeMindMap();
      
      // 绑定控制按钮
      document.getElementById('expand-all').addEventListener('click', () => mindmap.expandAll());
      document.getElementById('collapse-all').addEventListener('click', () => mindmap.collapseAll());
      document.getElementById('center').addEventListener('click', () => mindmap.center());
      document.getElementById('reset').addEventListener('click', () => mindmap.reset());
    });
  </script>
</body>
</html>
