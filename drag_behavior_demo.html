<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脑图拖拽功能测试</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsmind@0.5.3/style/jsmind.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #header {
            background-color: #f5f5f5;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
        }
        #mindmap-container {
            height: 600px;
            width: 100%;
            position: relative;
        }
        #controls {
            padding: 10px;
            background-color: #f9f9f9;
            border-bottom: 1px solid #eee;
        }
        #detail-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: 300px;
            height: 100%;
            background-color: white;
            border-left: 1px solid #ddd;
            padding: 15px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        #detail-title-input {
            font-size: 16px;
            padding: 5px;
            margin-bottom: 10px;
            width: calc(100% - 14px);
        }
        #detail-content-editor {
            flex-grow: 1;
            padding: 8px;
            font-family: monospace;
            border: 1px solid #ddd;
            resize: none;
        }
        #detail-node-id {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        #mindmap-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            display: none;
            z-index: 1000;
        }
        .jmnode {
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            padding: 5px 10px !important;
            border-radius: 3px !important;
            cursor: pointer;
        }
        .test-result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .success {
            color: green;
        }
        .failure {
            color: red;
        }
    </style>
</head>
<body>
    <div id="header">
        <h2>脑图拖拽功能测试</h2>
        <p>测试以下功能：1) 按住左键移动才触发拖拽 2) 拖拽预览 3) 拖拽连线显示</p>
    </div>
    
    <div id="controls">
        <button id="start-test">开始测试</button>
        <button id="export-diag">导出诊断信息</button>
        <span id="test-status"></span>
    </div>
    
    <div id="mindmap-container"></div>
    
    <div id="detail-panel">
        <h3>节点详情</h3>
        <input type="text" id="detail-title-input" placeholder="节点标题">
        <textarea id="detail-content-editor" placeholder="节点内容..."></textarea>
        <div id="detail-node-id"></div>
        <div id="detail-attachments-list"></div>
        <input type="file" id="fileInputAttachment" style="display: none;">
        <button id="detail-attachments-upload">添加附件</button>
        <div class="test-result" id="test-results">
            <h4>测试结果</h4>
            <div id="result-dragThreshold"></div>
            <div id="result-dragPreview"></div>
            <div id="result-connectionLine"></div>
            <div id="result-cleanup"></div>
        </div>
    </div>
    
    <div id="mindmap-toast"></div>
    <div id="mindmap-contextmenu" style="display:none;"></div>
    
    <input type="file" id="fileInputMindmap" style="display:none;">
    <div id="detail-content-preview" style="display:none;"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/jsmind@0.5.3/js/jsmind.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsmind@0.5.3/js/jsmind.draggable.js"></script>
    <script src="jsmind-controller.js"></script>
    <script src="fix_drag_state.js"></script>
    <script src="test-drag-behavior.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化脑图控制器
            window.mindmapController = new MindmapController();
            
            // 测试结果更新
            function updateTestResult(id, passed, message) {
                const el = document.getElementById('result-' + id);
                if (el) {
                    el.innerHTML = `<div class="${passed ? 'success' : 'failure'}">
                        ${passed ? '✅' : '❌'} ${id}: ${message}
                    </div>`;
                }
            }
            
            // 监听诊断记录更新测试结果
            const originalDiagLog = window.mindmapController._dragDiagLog;
            window.mindmapController._dragDiagLog = function(evt, data) {
                // 调用原始方法
                originalDiagLog.call(this, evt, data);
                
                // 拦截拖拽相关事件进行测试
                console.log(`[拖拽测试] ${evt}`, data);
                document.getElementById('test-status').textContent = `最近事件: ${evt}`;
                
                // 测试拖拽阈值
                if (evt === 'html5.dragstart') {
                    if (this._html5DnD && this._html5DnD.dragStarted) {
                        updateTestResult('dragThreshold', true, '通过：拖拽仅在按住鼠标并移动后触发');
                    }
                }
                
                // 测试预览元素
                if (evt === 'html5.dragover') {
                    if (this._html5DnD && this._html5DnD.dragElement) {
                        updateTestResult('dragPreview', true, '通过：拖拽预览元素已创建并显示');
                    }
                }
                
                // 测试连接线
                if (evt === 'html5.dragover') {
                    if (this._html5DnD && this._html5DnD.connectionPreview) {
                        updateTestResult('connectionLine', true, '通过：拖拽过程中显示了连接线');
                    }
                }
                
                // 测试清理
                if (evt === 'html5.drop' || evt === 'html5.drop.document') {
                    // 延迟检查，确保清理已完成
                    setTimeout(() => {
                        if ((!this._html5DnD || !this._html5DnD.dragElement) && 
                            (!this._html5DnD || !this._html5DnD.connectionPreview)) {
                            updateTestResult('cleanup', true, '通过：拖拽结束后预览元素和连接线已清理');
                        }
                    }, 100);
                }
            };
            
            // 导出诊断按钮
            document.getElementById('export-diag').addEventListener('click', function() {
                window.mindmapController.exportDragDiagnostics();
            });
            
            // 开始测试按钮
            document.getElementById('start-test').addEventListener('click', function() {
                document.getElementById('test-status').textContent = '请尝试拖动节点测试功能';
                // 重置测试结果
                updateTestResult('dragThreshold', false, '等待测试...');
                updateTestResult('dragPreview', false, '等待测试...');
                updateTestResult('connectionLine', false, '等待测试...');
                updateTestResult('cleanup', false, '等待测试...');
            });
        });
    </script>
</body>
</html>
