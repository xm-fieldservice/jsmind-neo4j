<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3.js 图形展示网格</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-group label {
            color: white;
            font-weight: 500;
        }

        select, button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover, button:hover {
            background: white;
            transform: translateY(-2px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .chart-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .chart-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }

        .chart-description {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .chart-container {
            width: 100%;
            height: 300px;
            position: relative;
        }

        .chart-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .chart-actions button {
            padding: 5px 10px;
            font-size: 0.8rem;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
        }

        .chart-actions button:hover {
            background: #e9ecef;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            opacity: 0.8;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .control-group {
                justify-content: space-between;
            }
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-card {
            animation: fadeIn 0.6s ease-out;
        }

        .chart-card:nth-child(odd) {
            animation-delay: 0.1s;
        }

        .chart-card:nth-child(even) {
            animation-delay: 0.2s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>D3.js 图形展示网格</h1>
            <p>探索 D3.js 强大的数据可视化能力 - 包含 13 种不同类型的图表展示</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="theme-select">主题：</label>
                <select id="theme-select">
                    <option value="light">亮色主题</option>
                    <option value="dark">暗色主题</option>
                    <option value="colorful">多彩主题</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="layout-select">布局：</label>
                <select id="layout-select">
                    <option value="grid">网格布局</option>
                    <option value="list">列表布局</option>
                </select>
            </div>

            <div class="control-group">
                <button id="refresh-btn">🔄 刷新数据</button>
                <button id="export-btn">📊 导出统计</button>
            </div>
        </div>

        <div class="grid" id="charts-grid">
            <!-- 图表将通过 JavaScript 动态生成 -->
        </div>

        <div class="footer">
            <p>D3.js v7.0.0 | 项目管理应用可视化组件 | 共展示 13 种图表类型</p>
        </div>
    </div>

    <script>
        // 图表配置数据
        const chartConfigs = [
            {

                type: 'bar',

                    { category: '项目B', value: 200 },
                    { category: '项目C', value: 150 },
                    { category: '项目D', value: 80 },
                    { category: '项目E', value: 180 }
                ]
            },
            {
                id: 'line-chart',
                title: '折线图',
                description: '展示数据随时间或其他连续变量的变化趋势',
                type: 'line',
                data: [
                    { time: '1月', value: 30 },
                    { time: '2月', value: 45 },
                    { time: '3月', value: 60 },
                    { time: '4月', value: 55 },
                    { time: '5月', value: 75 },
                    { time: '6月', value: 90 }
                ]
            },
            {
                id: 'scatter-plot',
                title: '散点图',
                description: '展示两个变量之间的关系，用于相关性分析',
                type: 'scatter',
                data: [
                    { x: 10, y: 20, size: 5 },
                    { x: 15, y: 35, size: 8 },
                    { x: 25, y: 15, size: 12 },
                    { x: 30, y: 45, size: 6 },
                    { x: 40, y: 25, size: 10 },
                    { x: 50, y: 60, size: 15 }
                ]
            },
            {
                id: 'pie-chart',
                title: '饼图',
                description: '展示各部分在整体中的比例关系',
                type: 'pie',
                data: [
                    { name: '已完成', value: 35 },
                    { name: '进行中', value: 25 },
                    { name: '待开始', value: 20 },
                    { name: '已延期', value: 15 },
                    { name: '已取消', value: 5 }
                ]
            },
            {
                id: 'donut-chart',
                title: '环形图',
                description: '饼图的变体，中间留空，视觉效果更现代',
                type: 'donut',
                data: [
                    { name: '前端开发', value: 40 },
                    { name: '后端开发', value: 30 },
                    { name: '数据库', value: 15 },
                    { name: '测试', value: 10 },
                    { name: '部署', value: 5 }
                ]
            },
            {
                id: 'force-graph',
                title: '力导向图',
                description: '展示节点间的关系网络，常用于社交网络分析',
                type: 'force',
                data: {
                    nodes: [
                        { id: 'A', group: 1 },
                        { id: 'B', group: 1 },
                        { id: 'C', group: 2 },
                        { id: 'D', group: 2 },
                        { id: 'E', group: 3 },
                        { id: 'F', group: 3 }
                    ],
                    links: [
                        { source: 'A', target: 'B', value: 1 },
                        { source: 'B', target: 'C', value: 1 },
                        { source: 'C', target: 'D', value: 1 },
                        { source: 'D', target: 'E', value: 1 },
                        { source: 'E', target: 'F', value: 1 },
                        { source: 'A', target: 'D', value: 1 }
                    ]
                }
            },
            {
                id: 'tree-diagram',
                title: '树状图',
                description: '展示层级结构数据，如组织架构或文件目录',
                type: 'tree',
                data: {
                    name: '根节点',
                    children: [
                        {
                            name: '分支1',
                            children: [
                                { name: '叶子1-1', value: 10 },
                                { name: '叶子1-2', value: 15 }
                            ]
                        },
                        {
                            name: '分支2',
                            children: [
                                { name: '叶子2-1', value: 20 },
                                { name: '叶子2-2', value: 25 }
                            ]
                        }
                    ]
                }
            },
            {
                id: 'sankey-diagram',
                title: '桑基图',
                description: '展示流量或资源的流动路径，适合流程分析',
                type: 'sankey',
                data: {
                    nodes: [
                        { name: '起点A' },
                        { name: '起点B' },
                        { name: '中间节点' },
                        { name: '终点X' },
                        { name: '终点Y' }
                    ],
                    links: [
                        { source: 0, target: 2, value: 10 },
                        { source: 1, target: 2, value: 15 },
                        { source: 2, target: 3, value: 20 },
                        { source: 2, target: 4, value: 5 }
                    ]
                }
            },
            {
                id: 'bubble-chart',
                title: '气泡图',
                description: '散点图的变体，用气泡大小表示第三个维度',
                type: 'bubble',
                data: [
                    { x: 10, y: 20, value: 30, category: 'A' },
                    { x: 15, y: 35, value: 45, category: 'A' },
                    { x: 25, y: 15, value: 60, category: 'B' },
                    { x: 30, y: 45, value: 25, category: 'B' },
                    { x: 40, y: 25, value: 80, category: 'C' },
                    { x: 50, y: 60, value: 35, category: 'C' }
                ]
            },
            {
                id: 'radar-chart',
                title: '雷达图',
                description: '多维度数据对比，适合性能评估和技能分析',
                type: 'radar',
                data: [
                    { axis: '技术能力', value: 85 },
                    { axis: '沟通能力', value: 70 },
                    { axis: '项目管理', value: 90 },
                    { axis: '创新能力', value: 65 },
                    { axis: '团队协作', value: 80 },
                    { axis: '学习能力', value: 95 }
                ]
            },
            {
                id: 'brush-zoom-chart',
                title: '刷选缩放图',
                description: '支持区域选择和缩放交互的复杂图表',
                type: 'brushZoom',
                data: [
                    { time: 1, value: 30 },
                    { time: 2, value: 45 },
                    { time: 3, value: 60 },
                    { time: 4, value: 55 },
                    { time: 5, value: 75 },
                    { time: 6, value: 90 },
                    { time: 7, value: 85 },
                    { time: 8, value: 70 },
                    { time: 9, value: 95 },
                    { time: 10, value: 110 }
                ]
            },
            {
                id: 'animated-chart',
                title: '动画过渡图',
                description: '展示D3.js强大的动画和过渡效果',
                type: 'animated',
                data: [
                    { category: '阶段1', value: 50 },
                    { category: '阶段2', value: 75 },
                    { category: '阶段3', value: 90 },
                    { category: '阶段4', value: 65 },
                    { category: '阶段5', value: 85 }
                ]
            },
            {
                id: 'hierarchical-chart',
                title: '层级图',
                description: '多种层级可视化技术的综合展示',
                type: 'hierarchical',
                data: {
                    name: '根',
                    children: [
                        {
                            name: '类别A',
                            children: [
                                { name: '项目A1', value: 100 },
                                { name: '项目A2', value: 150 }
                            ]
                        },
                        {
                            name: '类别B',
                            children: [
                                { name: '项目B1', value: 200 },
                                { name: '项目B2', value: 120 }
                            ]
                        }
                    ]
                }
            }
        ];

        // 初始化函数
        function initCharts() {
            const grid = d3.select('#charts-grid');
            
            chartConfigs.forEach((config, index) => {
                // 创建图表卡片
                const card = grid.append('div')
                    .attr('class', 'chart-card')
                    .style('animation-delay', `${index * 0.1}s`);
                
                // 添加标题区域
                card.append('div')
                    .attr('class', 'chart-header')
                    .html(`
                        <div class="chart-title">${config.title}</div>
                        <div style="color: #666; font-size: 0.9rem;">#${index + 1}</div>
                    `);
                
                // 添加描述
                card.append('div')
                    .attr('class', 'chart-description')
                    .text(config.description);
                
                // 添加图表容器
                const container = card.append('div')
                    .attr('class', 'chart-container')
                    .attr('id', config.id);
                
                // 添加操作按钮
                const actions = card.append('div')
                    .attr('class', 'chart-actions');
                
                actions.append('button')
                    .text('放大查看')
                    .on('click', () => showFullscreenChart(config));
                
                actions.append('button')
                    .text('导出SVG')
                    .on('click', () => exportChart(config.id));
                
                // 渲染图表
                setTimeout(() => renderChart(config), 100 + index * 50);
            });
        }

        // 渲染单个图表
        function renderChart(config) {
            const container = d3.select(`#${config.id}`);
            const width = container.node().clientWidth;
            const height = container.node().clientHeight;
            
            // 清除现有内容
            container.html('');
            
            switch(config.type) {
                case 'bar':
                    renderBarChart(container, config.data, width, height);
                    break;
                case 'line':
                    renderLineChart(container, config.data, width, height);
                    break;
                case 'scatter':
                    renderScatterPlot(container, config.data, width, height);
                    break;
                case 'pie':
                    renderPieChart(container, config.data, width, height);
                    break;
                case 'donut':
                    renderDonutChart(container, config.data, width, height);
                    break;
                case 'force':
                    renderForceGraph(container, config.data, width, height);
                    break;
                case 'tree':
                    renderTreeDiagram(container, config.data, width, height);
                    break;
                case 'sankey':
                    renderSankeyDiagram(container, config.data, width, height);
                    break;
                case 'bubble':
                    renderBubbleChart(container, config.data, width, height);
                    break;
                case 'radar':
                    renderRadarChart(container, config.data, width, height);
                    break;
                case 'brushZoom':
                    renderBrushZoomChart(container, config.data, width, height);
                    break;
                case 'animated':
                    renderAnimatedChart(container, config.data, width, height);
                    break;
                case 'hierarchical':
                    renderHierarchicalChart(container, config.data, width, height);
                    break;
            }
        }

        // 渲染柱状图
        function renderBarChart(container, data, width, height) {
            const margin = { top: 20, right: 30, bottom: 40, left: 40 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            const x = d3.scaleBand()
                .domain(data.map(d => d.category))
                .range([0, innerWidth])
                .padding(0.1);

            const y = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.value)])
                .nice()
                .range([innerHeight, 0]);

            // 添加X轴
            svg.append('g')
                .attr('transform', `translate(0,${innerHeight})`)
                .call(d3.axisBottom(x))
                .selectAll('text')
                .attr('transform', 'rotate(-45)')
                .style('text-anchor', 'end');

            // 添加Y轴
            svg.append('g')
                .call(d3.axisLeft(y));

            // 添加柱状图
            svg.selectAll('.bar')
                .data(data)
                .enter()
                .append('rect')
                .attr('class', 'bar')
                .attr('x', d => x(d.category))
                .attr('y', d => y(d.value))
                .attr('width', x.bandwidth())
                .attr('height', d => innerHeight - y(d.value))
                .attr('fill', 'steelblue')
                .on('mouseover', function(event, d) {
                    d3.select(this).attr('fill', 'orange');
                    showTooltip(event, d);
                })
                .on('mouseout', function(event, d) {
                    d3.select(this).attr('fill', 'steelblue');
                    hideTooltip();
                });
        }

        // 渲染折线图
        function renderLineChart(container, data, width, height) {
            const margin = { top: 20, right: 30, bottom: 40, left: 40 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            const x = d3.scalePoint()
                .domain(data.map(d => d.time))
                .range([0, innerWidth]);

            const y = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.value)])
                .nice()
                .range([innerHeight, 0]);

            const line = d3.line()
                .x(d => x(d.time))
                .y(d => y(d.value))
                .curve(d3.curveMonotoneX);

            // 添加X轴
            svg.append('g')
                .attr('transform', `translate(0,${innerHeight})`)
                .call(d3.axisBottom(x));

            // 添加Y轴
            svg.append('g')
                .call(d3.axisLeft(y));

            // 添加折线
            svg.append('path')
                .datum(data)
                .attr('class', 'line')
                .attr('d', line)
                .attr('fill', 'none')
                .attr('stroke', 'steelblue')
                .attr('stroke-width', 3);

            // 添加数据点
            svg.selectAll('.dot')
                .data(data)
                .enter()
                .append('circle')
                .attr('class', 'dot')
                .attr('cx', d => x(d.time))
                .attr('cy', d => y(d.value))
                .attr('r', 5)
                .attr('fill', 'white')
                .attr('stroke', 'steelblue')
                .attr('stroke-width', 2);
        }

        // 渲染散点图
        function renderScatterPlot(container, data, width, height) {
            const margin = { top: 20, right: 30, bottom: 40, left: 40 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            const x = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.x)])
                .nice()
                .range([0, innerWidth]);

            const y = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.y)])
                .nice()
                .range([innerHeight, 0]);

            // 添加X轴
            svg.append('g')
                .attr('transform', `translate(0,${innerHeight})`)
                .call(d3.axisBottom(x));

            // 添加Y轴
            svg.append('g')
                .call(d3.axisLeft(y));

            // 添加散点
            svg.selectAll('.dot')
                .data(data)
                .enter()
                .append('circle')
                .attr('class', 'dot')
                .attr('cx', d => x(d.x))
                .attr('cy', d => y(d.y))
                .attr('r', d => d.size)
                .attr('fill', 'steelblue')
                .attr('opacity', 0.7)
                .on('mouseover', function(event, d) {
                    d3.select(this).attr('fill', 'red').attr('r', d.size * 1.5);
                })
                .on('mouseout', function(event, d) {
                    d3.select(this).attr('fill', 'steelblue').attr('r', d.size);
                });
        }

        // 渲染饼图
        function renderPieChart(container, data, width, height) {
            const radius = Math.min(width, height) / 2 - 40;
            
            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${width / 2},${height / 2})`);

            const color = d3.scaleOrdinal()
                .domain(data.map(d => d.name))
                .range(d3.schemeCategory10);

            const pie = d3.pie()
                .value(d => d.value);

            const arc = d3.arc()
                .innerRadius(0)
                .outerRadius(radius);

            const arcs = svg.selectAll('.arc')
                .data(pie(data))
                .enter()
                .append('g')
                .attr('class', 'arc');

            arcs.append('path')
                .attr('d', arc)
                .attr('fill', d => color(d.data.name))
                .on('mouseover', function(event, d) {
                    d3.select(this).attr('opacity', 0.8);
                })
                .on('mouseout', function(event, d) {
                    d3.select(this).attr('opacity', 1);
                });

            // 添加标签
            arcs.append('text')
                .attr('transform', d => `translate(${arc.centroid(d)})`)
                .attr('text-anchor', 'middle')
                .text(d => d.data.name)
                .style('font-size', '12px')
                .style('fill', 'white');
        }

        // 渲染环形图
        function renderDonutChart(container, data, width, height) {
            const radius = Math.min(width, height) / 2 - 40;
            const innerRadius = radius * 0.6;
            
            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${width / 2},${height / 2})`);

            const color = d3.scaleOrdinal()
                .domain(data.map(d => d.name))
                .range(d3.schemeSet3);

            const pie = d3.pie()
                .value(d => d.value);

            const arc = d3.arc()
                .innerRadius(innerRadius)
                .outerRadius(radius);

            const arcs = svg.selectAll('.arc')
                .data(pie(data))
                .enter()
                .append('g')
                .attr('class', 'arc');

            arcs.append('path')
                .attr('d', arc)
                .attr('fill', d => color(d.data.name))
                .on('mouseover', function(event, d) {
                    d3.select(this).attr('opacity', 0.8);
                })
                .on('mouseout', function(event, d) {
                    d3.select(this).attr('opacity', 1);
                });
        }

        // 渲染力导向图
        function renderForceGraph(container, data, width, height) {
            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height);

            const color = d3.scaleOrdinal(d3.schemeCategory10);

            const simulation = d3.forceSimulation(data.nodes)
                .force('link', d3.forceLink(data.links).id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2));

            const link = svg.append('g')
                .attr('class', 'links')
                .selectAll('line')
                .data(data.links)
                .enter()
                .append('line')
                .attr('stroke', '#999')
                .attr('stroke-opacity', 0.6)
                .attr('stroke-width', d => Math.sqrt(d.value));

            const node = svg.append('g')
                .attr('class', 'nodes')
                .selectAll('circle')
                .data(data.nodes)
                .enter()
                .append('circle')
                .attr('r', 10)
                .attr('fill', d => color(d.group))
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));

            node.append('title')
                .text(d => d.id);

            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);
            });

            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
        }

        // 渲染树状图
        function renderTreeDiagram(container, data, width, height) {
            const margin = { top: 20, right: 90, bottom: 30, left: 90 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            const treeLayout = d3.tree().size([innerHeight, innerWidth]);
            const root = d3.hierarchy(data);
            const treeData = treeLayout(root);

            // 添加链接
            svg.selectAll('.link')
                .data(treeData.links())
                .enter()
                .append('path')
                .attr('class', 'link')
                .attr('d', d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x))
                .attr('fill', 'none')
                .attr('stroke', '#ccc')
                .attr('stroke-width', 2);

            // 添加节点
            const node = svg.selectAll('.node')
                .data(treeData.descendants())
                .enter()
                .append('g')
                .attr('class', 'node')
                .attr('transform', d => `translate(${d.y},${d.x})`);

            node.append('circle')
                .attr('r', 10)
                .attr('fill', 'steelblue');

            node.append('text')
                .attr('dy', '.35em')
                .attr('x', d => d.children ? -13 : 13)
                .attr('text-anchor', d => d.children ? 'end' : 'start')
                .text(d => d.data.name)
                .style('font-size', '12px');
        }

        // 渲染桑基图
        function renderSankeyDiagram(container, data, width, height) {
            const margin = { top: 10, right: 10, bottom: 10, left: 10 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            const sankey = d3.sankey()
                .nodeWidth(15)
                .nodePadding(10)
                .extent([[1, 1], [innerWidth - 1, innerHeight - 6]]);

            const { nodes, links } = sankey({
                nodes: data.nodes.map(d => Object.assign({}, d)),
                links: data.links.map(d => Object.assign({}, d))
            });

            // 添加链接
            svg.append('g')
                .attr('fill', 'none')
                .attr('stroke-opacity', 0.5)
                .selectAll('path')
                .data(links)
                .join('path')
                .attr('d', d3.sankeyLinkHorizontal())
                .attr('stroke', d => d3.schemeCategory10[d.source.index % 10])
                .attr('stroke-width', d => Math.max(1, d.width));

            // 添加节点
            const node = svg.append('g')
                .selectAll('rect')
                .data(nodes)
                .join('rect')
                .attr('x', d => d.x0)
                .attr('y', d => d.y0)
                .attr('height', d => d.y1 - d.y0)
                .attr('width', d => d.x1 - d.x0)
                .attr('fill', d => d3.schemeCategory10[d.index % 10]);

            // 添加节点标签
            svg.append('g')
                .attr('font-family', 'sans-serif')
                .attr('font-size', 10)
                .selectAll('text')
                .data(nodes)
                .join('text')
                .attr('x', d => d.x0 < innerWidth / 2 ? d.x1 + 6 : d.x0 - 6)
                .attr('y', d => (d.y1 + d.y0) / 2)
                .attr('dy', '0.35em')
                .attr('text-anchor', d => d.x0 < innerWidth / 2 ? 'start' : 'end')
                .text(d => d.name);
        }

        // 渲染气泡图
        function renderBubbleChart(container, data, width, height) {
            const margin = { top: 20, right: 30, bottom: 40, left: 40 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            const x = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.x)])
                .nice()
                .range([0, innerWidth]);

            const y = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.y)])
                .nice()
                .range([innerHeight, 0]);

            const size = d3.scaleSqrt()
                .domain([0, d3.max(data, d => d.value)])
                .range([5, 30]);

            const color = d3.scaleOrdinal()
                .domain(data.map(d => d.category))
                .range(d3.schemeCategory10);

            // 添加X轴
            svg.append('g')
                .attr('transform', `translate(0,${innerHeight})`)
                .call(d3.axisBottom(x));

            // 添加Y轴
            svg.append('g')
                .call(d3.axisLeft(y));

            // 添加气泡
            svg.selectAll('.bubble')
                .data(data)
                .enter()
                .append('circle')
                .attr('class', 'bubble')
                .attr('cx', d => x(d.x))
                .attr('cy', d => y(d.y))
                .attr('r', d => size(d.value))
                .attr('fill', d => color(d.category))
                .attr('opacity', 0.7)
                .on('mouseover', function(event, d) {
                    d3.select(this).attr('stroke', '#000').attr('stroke-width', 2);
                })
                .on('mouseout', function(event, d) {
                    d3.select(this).attr('stroke', 'none');
                });
        }

        // 渲染雷达图
        function renderRadarChart(container, data, width, height) {
            const radius = Math.min(width, height) / 2 - 40;
            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${width / 2},${height / 2})`);

            const angleSlice = (2 * Math.PI) / data.length;
            const rScale = d3.scaleLinear()
                .domain([0, 100])
                .range([0, radius]);

            // 添加网格线
            const levels = 5;
            for (let level = 1; level <= levels; level++) {
                const levelFactor = radius * level / levels;
                svg.selectAll('.levels')
                    .data(data)
                    .enter()
                    .append('line')
                    .attr('x1', (d, i) => levelFactor * Math.cos(angleSlice * i - Math.PI / 2))
                    .attr('y1', (d, i) => levelFactor * Math.sin(angleSlice * i - Math.PI / 2))
                    .attr('x2', (d, i) => levelFactor * Math.cos(angleSlice * (i + 1) - Math.PI / 2))
                    .attr('y2', (d, i) => levelFactor * Math.sin(angleSlice * (i + 1) - Math.PI / 2))
                    .attr('class', 'line')
                    .style('stroke', 'grey')
                    .style('stroke-opacity', 0.5)
                    .style('stroke-width', '0.5px');

                svg.selectAll('.levels')
                    .data(data)
                    .enter()
                    .append('text')
                    .attr('class', 'legend')
                    .style('font-size', '10px')
                    .attr('text-anchor', 'middle')
                    .attr('dy', '0.35em')
                    .attr('x', (d, i) => levelFactor * Math.cos(angleSlice * i - Math.PI / 2))
                    .attr('y', (d, i) => levelFactor * Math.sin(angleSlice * i - Math.PI / 2))
                    .text((level * 100 / levels).toString());
            }

            // 添加轴线
            for (let i = 0; i < data.length; i++) {
                svg.append('line')
                    .attr('x1', 0)
                    .attr('y1', 0)
                    .attr('x2', radius * Math.cos(angleSlice * i - Math.PI / 2))
                    .attr('y2', radius * Math.sin(angleSlice * i - Math.PI / 2))
                    .attr('class', 'line')
                    .style('stroke', 'grey')
                    .style('stroke-width', '1px');

                svg.append('text')
                    .attr('class', 'legend')
                    .style('font-size', '11px')
                    .attr('text-anchor', 'middle')
                    .attr('dy', '0.35em')
                    .attr('x', (radius + 10) * Math.cos(angleSlice * i - Math.PI / 2))
                    .attr('y', (radius + 10) * Math.sin(angleSlice * i - Math.PI / 2))
                    .text(data[i].axis);
            }

            // 添加数据线
            const radarLine = d3.lineRadial()
                .angle((d, i) => i * angleSlice)
                .radius(d => rScale(d.value))
                .curve(d3.curveLinearClosed);

            svg.append('path')
                .datum(data)
                .attr('d', radarLine)
                .style('stroke-width', 2)
                .style('stroke', 'steelblue')
                .style('fill', 'steelblue')
                .style('fill-opacity', 0.1);
        }

        // 渲染刷选缩放图
        function renderBrushZoomChart(container, data, width, height) {
            const margin = { top: 20, right: 30, bottom: 40, left: 40 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height);

            const mainGroup = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            const x = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.time)])
                .range([0, innerWidth]);

            const y = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.value)])
                .range([innerHeight, 0]);

            const line = d3.line()
                .x(d => x(d.time))
                .y(d => y(d.value))
                .curve(d3.curveMonotoneX);

            // 主图表
            mainGroup.append('path')
                .datum(data)
                .attr('class', 'line')
                .attr('d', line)
                .attr('fill', 'none')
                .attr('stroke', 'steelblue')
                .attr('stroke-width', 2);

            mainGroup.append('g')
                .attr('transform', `translate(0,${innerHeight})`)
                .call(d3.axisBottom(x));

            mainGroup.append('g')
                .call(d3.axisLeft(y));

            // 刷选区域
            const brush = d3.brushX()
                .extent([[0, 0], [innerWidth, 30]])
                .on('brush', brushed)
                .on('end', brushended);

            const brushGroup = svg.append('g')
                .attr('transform', `translate(${margin.left},${height - 60})`);

            const contextX = d3.scaleLinear()
                .domain(x.domain())
                .range([0, innerWidth]);

            const contextLine = d3.line()
                .x(d => contextX(d.time))
                .y(15)
                .curve(d3.curveMonotoneX);

            brushGroup.append('path')
                .datum(data)
                .attr('class', 'context-line')
                .attr('d', contextLine)
                .attr('fill', 'none')
                .attr('stroke', '#999')
                .attr('stroke-width', 1);

            brushGroup.append('g')
                .attr('class', 'brush')
                .call(brush);

            function brushed(event) {
                if (!event.selection) return;
                const [x0, x1] = event.selection.map(contextX.invert);
                x.domain([x0, x1]);
                mainGroup.select('.line').attr('d', line);
                mainGroup.select('.x-axis').call(d3.axisBottom(x));
            }

            function brushended(event) {
                if (!event.selection) {
                    x.domain([0, d3.max(data, d => d.time)]);
                    mainGroup.select('.line').attr('d', line);
                    mainGroup.select('.x-axis').call(d3.axisBottom(x));
                }
            }
        }

        // 渲染动画过渡图
        function renderAnimatedChart(container, data, width, height) {
            const margin = { top: 20, right: 30, bottom: 40, left: 40 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            const x = d3.scaleBand()
                .domain(data.map(d => d.category))
                .range([0, innerWidth])
                .padding(0.1);

            const y = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.value)])
                .range([innerHeight, 0]);

            // 添加X轴
            svg.append('g')
                .attr('transform', `translate(0,${innerHeight})`)
                .call(d3.axisBottom(x));

            // 添加Y轴
            svg.append('g')
                .call(d3.axisLeft(y));

            // 初始动画
            const bars = svg.selectAll('.bar')
                .data(data)
                .enter()
                .append('rect')
                .attr('class', 'bar')
                .attr('x', d => x(d.category))
                .attr('y', innerHeight)
                .attr('width', x.bandwidth())
                .attr('height', 0)
                .attr('fill', 'steelblue');

            bars.transition()
                .duration(1000)
                .attr('y', d => y(d.value))
                .attr('height', d => innerHeight - y(d.value))
                .delay((d, i) => i * 100);

            // 添加动画控制
            let animationRunning = false;
            
            container.append('button')
                .style('position', 'absolute')
                .style('top', '10px')
                .style('right', '10px')
                .text('重新播放动画')
                .on('click', function() {
                    if (animationRunning) return;
                    animationRunning = true;
                    
                    bars.transition()
                        .duration(500)
                        .attr('y', innerHeight)
                        .attr('height', 0)
                        .on('end', function() {
                            bars.transition()
                                .duration(1000)
                                .attr('y', d => y(d.value))
                                .attr('height', d => innerHeight - y(d.value))
                                .delay((d, i) => i * 100)
                                .on('end', () => animationRunning = false);
                        });
                });
        }

        // 渲染层级图
        function renderHierarchicalChart(container, data, width, height) {
            const margin = { top: 10, right: 10, bottom: 10, left: 10 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            const root = d3.hierarchy(data)
                .sum(d => d.value)
                .sort((a, b) => b.value - a.value);

            const pack = d3.pack()
                .size([innerWidth, innerHeight])
                .padding(3);

            const packed = pack(root);

            const node = svg.selectAll('circle')
                .data(packed.descendants())
                .enter()
                .append('g')
                .attr('transform', d => `translate(${d.x},${d.y})`);

            node.append('circle')
                .attr('r', d => d.r)
                .attr('fill', d => d.depth === 0 ? '#fff' : d3.schemeCategory10[d.depth % 10])
                .attr('stroke', '#fff')
                .attr('stroke-width', 2)
                .on('mouseover', function(event, d) {
                    d3.select(this).attr('stroke-width', 4);
                })
                .on('mouseout', function(event, d) {
                    d3.select(this).attr('stroke-width', 2);
                });

            node.filter(d => !d.children)
                .append('text')
                .attr('dy', '0.3em')
                .attr('text-anchor', 'middle')
                .text(d => d.data.name)
                .style('font-size', d => Math.min(2 * d.r, (2 * d.r - 8) / d.data.name.length * 10) + 'px')
                .style('fill', 'white')
                .style('pointer-events', 'none');
        }

        // 工具提示功能
        function showTooltip(event, data) {
            const tooltip = d3.select('body').append('div')
                .attr('class', 'tooltip')
                .style('position', 'absolute')
                .style('background', 'rgba(0,0,0,0.8)')
                .style('color', 'white')
                .style('padding', '8px')
                .style('border-radius', '4px')
                .style('pointer-events', 'none')
                .style('z-index', '1000');

            tooltip.html(`值: ${data.value}`)
                .style('left', (event.pageX + 10) + 'px')
                .style('top', (event.pageY - 28) + 'px');
        }

        function hideTooltip() {
            d3.select('.tooltip').remove();
        }

        // 全屏查看功能
        function showFullscreenChart(config) {
            alert(`即将全屏显示: ${config.title}`);
            // 实际实现中这里会打开模态框或新页面
        }

        // 导出功能
        function exportChart(chartId) {
            const svg = d3.select(`#${chartId} svg`);
            const svgData = new XMLSerializer().serializeToString(svg.node());
            const blob = new Blob([svgData], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `${chartId}.svg`;
            a.click();
            
            URL.revokeObjectURL(url);
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            
            // 添加事件监听器
            document.getElementById('refresh-btn').addEventListener('click', function() {
                chartConfigs.forEach(config => {
                    // 模拟数据刷新
                    config.data.forEach(d => {
                        if (d.value) d.value = Math.random() * 200 + 50;
                    });
                    renderChart(config);
                });
            });
            
            document.getElementById('theme-select').addEventListener('change', function(e) {
                // 主题切换逻辑
                console.log('切换主题:', e.target.value);
            });
        });

        // 窗口大小变化时重绘图表
        window.addEventListener('resize', function() {
            chartConfigs.forEach(config => {
                renderChart(config);
            });
        });
    </script>
</body>
