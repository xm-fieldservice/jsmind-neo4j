<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模块化架构测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 模块化架构测试页面</h1>
    
    <div class="test-section">
        <h2>📦 模块加载状态</h2>
        <div id="module-status"></div>
    </div>
    
    <div class="test-section">
        <h2>🔧 控制器状态</h2>
        <div id="controller-status"></div>
    </div>
    
    <div class="test-section">
        <h2>⚡ 功能测试</h2>
        <div id="function-tests"></div>
        <button onclick="runFunctionTests()">运行功能测试</button>
    </div>
    
    <div class="test-section">
        <h2>📊 测试结果</h2>
        <pre id="test-results"></pre>
    </div>

    <!-- 加载模块文件 -->
    <script src="jsmind-controller-storage.js"></script>
    <script src="jsmind-controller-data.js"></script>
    <script src="jsmind-controller-tags.js"></script>
    <script src="jsmind-controller-ui.js"></script>
    <script src="jsmind-controller-events.js"></script>
    <script src="jsmind-controller-advanced.js"></script>
    
    <!-- 加载核心控制器 -->
    <script src="jsmind-controller.js"></script>
    
    <script>
        // 等待页面加载完成
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                checkModuleStatus();
                checkControllerStatus();
            }, 1000);
        });
        
        function checkModuleStatus() {
            const modules = [
                'StorageModule',
                'UIModule', 
                'EventsModule',
                'DataModule',
                'TagsModule',
                'AdvancedModule'
            ];
            
            const statusDiv = document.getElementById('module-status');
            let html = '';
            let loadedCount = 0;
            
            modules.forEach(moduleName => {
                const exists = window[moduleName] !== undefined;
                if (exists) loadedCount++;
                
                html += `<div class="${exists ? 'success' : 'error'}">
                    ${exists ? '✅' : '❌'} ${moduleName}: ${exists ? '已加载' : '未加载'}
                </div>`;
            });
            
            html = `<div><strong>模块加载进度: ${loadedCount}/${modules.length}</strong></div>` + html;
            statusDiv.innerHTML = html;
        }
        
        function checkControllerStatus() {
            const statusDiv = document.getElementById('controller-status');
            
            if (window.mindmapController) {
                statusDiv.innerHTML = `
                    <div class="success">✅ MindmapController 已创建</div>
                    <div>实例类型: ${typeof window.mindmapController}</div>
                    <div>构造函数: ${window.mindmapController.constructor.name}</div>
                `;
            } else if (window.MindmapController) {
                statusDiv.innerHTML = `
                    <div class="warning">⚠️ MindmapController 类已定义，但实例未创建</div>
                    <div>类类型: ${typeof window.MindmapController}</div>
                `;
            } else {
                statusDiv.innerHTML = `
                    <div class="error">❌ MindmapController 未加载</div>
                `;
            }
        }
        
        function runFunctionTests() {
            const testsDiv = document.getElementById('function-tests');
            const resultsDiv = document.getElementById('test-results');
            
            let results = [];
            
            if (!window.mindmapController) {
                testsDiv.innerHTML = '<div class="error">❌ 无法运行测试：MindmapController未创建</div>';
                return;
            }
            
            const controller = window.mindmapController;
            
            // 测试存储模块
            try {
                if (typeof controller.getDefaultData === 'function') {
                    const defaultData = controller.getDefaultData();
                    results.push(`✅ 存储模块 - getDefaultData: ${defaultData ? '成功' : '失败'}`);
                } else {
                    results.push('❌ 存储模块 - getDefaultData: 方法不存在');
                }
            } catch (e) {
                results.push(`❌ 存储模块 - getDefaultData: ${e.message}`);
            }
            
            // 测试数据模块
            try {
                if (typeof controller.findNode === 'function') {
                    results.push('✅ 数据模块 - findNode: 方法存在');
                } else {
                    results.push('❌ 数据模块 - findNode: 方法不存在');
                }
            } catch (e) {
                results.push(`❌ 数据模块 - findNode: ${e.message}`);
            }
            
            // 测试标签模块
            try {
                if (typeof controller._parseTagsFromContent === 'function') {
                    const testContent = '标签: 测试, 验证\n\n这是测试内容';
                    const parsed = controller._parseTagsFromContent(testContent);
                    const isValid = parsed.tags && parsed.tags.includes('测试');
                    results.push(`✅ 标签模块 - _parseTagsFromContent: ${isValid ? '成功' : '失败'}`);
                } else {
                    results.push('❌ 标签模块 - _parseTagsFromContent: 方法不存在');
                }
            } catch (e) {
                results.push(`❌ 标签模块 - _parseTagsFromContent: ${e.message}`);
            }
            
            // 测试UI模块
            try {
                if (typeof controller.showToast === 'function') {
                    controller.showToast('模块化测试', 'info', 1000);
                    results.push('✅ UI模块 - showToast: 成功');
                } else {
                    results.push('❌ UI模块 - showToast: 方法不存在');
                }
            } catch (e) {
                results.push(`❌ UI模块 - showToast: ${e.message}`);
            }
            
            // 显示结果
            const successCount = results.filter(r => r.startsWith('✅')).length;
            const totalCount = results.length;
            
            testsDiv.innerHTML = `
                <div><strong>功能测试完成: ${successCount}/${totalCount} 通过</strong></div>
                <div class="${successCount === totalCount ? 'success' : 'warning'}">
                    ${successCount === totalCount ? '🎉 所有测试通过！' : '⚠️ 部分测试失败'}
                </div>
            `;
            
            resultsDiv.textContent = results.join('\n');
        }
    </script>
</body>
</html>
